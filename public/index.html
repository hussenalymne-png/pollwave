<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PollWave</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .screen.active { display: block; }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        h1 { font-size: 2.5em; margin-bottom: 10px; }
        h2 { font-size: 1.8em; margin-bottom: 20px; }

        .logo { font-size: 3em; margin-bottom: 10px; }

        input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1.1em;
            margin: 10px 0;
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: #e94560; }
        input::placeholder { color: rgba(255,255,255,0.5); }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover { transform: translateY(-2px); opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            margin-right: 8px;
        }

        .status-dot.connected { background: #44ff88; }

        .status-bar {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            display: flex;
            align-items: center;
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.95em;
        }

        /* Warte Screen */
        .waiting-info {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .player-name-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #44ff88;
            margin: 10px 0;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Fragen Screen */
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-counter {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .timer-circle {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .timer-circle svg {
            transform: rotate(-90deg);
        }

        .timer-circle .timer-bg {
            fill: none;
            stroke: rgba(255,255,255,0.2);
            stroke-width: 4;
        }

        .timer-circle .timer-progress {
            fill: none;
            stroke: #e94560;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1em;
            font-weight: bold;
        }

        .question-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin: 15px 0;
        }

        .question-text {
            font-size: 1.3em;
            margin: 20px 0;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .option-btn {
            padding: 20px 15px;
            border-radius: 12px;
            border: none;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            width: 100%;
            margin: 0;
        }

        .option-btn:nth-child(1) { background: #e74c3c; }
        .option-btn:nth-child(2) { background: #3498db; }
        .option-btn:nth-child(3) { background: #2ecc71; }
        .option-btn:nth-child(4) { background: #f39c12; }

        .option-btn:hover { transform: scale(1.05); }
        .option-btn:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
        .option-btn.selected { opacity: 0.7; transform: scale(0.98); }

        /* Ergebnis Screen */
        .result-icon {
            font-size: 4em;
            margin: 20px 0;
        }

        .result-score {
            font-size: 2em;
            font-weight: bold;
            color: #44ff88;
        }

        .result-rank {
            font-size: 1.1em;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* Leaderboard */
        .leaderboard-list {
            list-style: none;
            margin-top: 20px;
        }

        .leaderboard-list li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin: 8px 0;
            font-size: 1em;
        }

        .leaderboard-list li.me {
            background: rgba(233,69,96,0.3);
            border: 1px solid #e94560;
        }

        .rank-num {
            font-size: 1.3em;
            width: 35px;
        }

        .player-score {
            margin-left: auto;
            font-weight: bold;
            color: #44ff88;
        }

        /* Finish Screen */
        .finish-podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            margin: 30px 0;
        }

        .podium-item {
            text-align: center;
        }

        .podium-block {
            width: 80px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
        }

        .podium-name {
            font-size: 0.85em;
            margin-top: 8px;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Canvas für Konfetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Verbinde...</span>
</div>

<!-- Konfetti Canvas -->
<canvas id="confetti-canvas"></canvas>

<!-- JOIN SCREEN -->
<div class="screen active" id="joinScreen">
    <div class="card">
        <div class="logo">🎮</div>
        <h1>PollWave</h1>
        <p style="opacity:0.8; margin-bottom:30px">Das schnelle Quiz-Spiel!</p>

        <input
            type="text"
            id="nameInput"
            placeholder="Dein Name"
            maxlength="20"
            autocomplete="off"
        />

        <button id="joinBtn" onclick="joinGame()">
            Beitreten! 🚀
        </button>

        <p class="error-msg" id="joinError"></p>
    </div>
</div>

<!-- WARTE SCREEN -->
<div class="screen" id="waitScreen">
    <div class="card">
        <div class="logo pulse">⏳</div>
        <h2>Warte auf Start...</h2>
        <div class="waiting-info">
            <p>Du bist dabei als:</p>
            <div class="player-name-display" id="waitPlayerName"></div>
        </div>
        <p style="opacity:0.7">Der Admin startet das Spiel gleich!</p>
    </div>
</div>

<!-- FRAGEN SCREEN -->
<div class="screen" id="questionScreen">
    <div class="card">
        <div class="question-header">
            <span class="question-counter" id="questionCounter">Frage 1/5</span>
            <div class="timer-circle">
                <svg width="60" height="60" viewBox="0 0 60 60">
                    <circle class="timer-bg" cx="30" cy="30" r="26"/>
                    <circle class="timer-progress" id="timerProgress"
                        cx="30" cy="30" r="26"
                        stroke-dasharray="163.4"
                        stroke-dashoffset="0"/>
                </svg>
                <div class="timer-number" id="timerNumber">20</div>
            </div>
        </div>

        <img id="questionImage" class="question-image" style="display:none" alt="Fragen Bild"/>

        <div class="question-text" id="questionText">Frage lädt...</div>

        <div class="options-grid" id="optionsGrid"></div>
    </div>
</div>

<!-- ERGEBNIS SCREEN -->
<div class="screen" id="resultScreen">
    <div class="card">
        <div class="result-icon" id="resultIcon">✅</div>
        <h2 id="resultTitle">Richtig!</h2>
        <div class="result-score" id="resultScore">+150</div>
        <div class="result-rank" id="resultRank">Platz 3 von 10</div>

        <div style="margin-top:30px; opacity:0.7">
            <p>Nächste Frage kommt gleich...</p>
        </div>
    </div>
</div>

<!-- LEADERBOARD SCREEN -->
<div class="screen" id="leaderboardScreen">
    <div class="card">
        <h2>🏆 Rangliste</h2>
        <ul class="leaderboard-list" id="leaderboardList"></ul>
    </div>
</div>

<!-- FINISH SCREEN -->
<div class="screen" id="finishScreen">
    <div class="card">
        <h2>🎉 Spiel beendet!</h2>
        <div class="finish-podium" id="finishPodium"></div>
        <ul class="leaderboard-list" id="finalLeaderboard"></ul>
    </div>
</div>

<script>
    // ===== SOCKET =====
    const socket = io();
    let myName = '';
    let myScore = 0;
    let currentMaxTime = 20;
    let roomCode = '';

    // URL Parameter lesen
    const urlParams = new URLSearchParams(window.location.search);
    roomCode = (urlParams.get('code') || urlParams.get('room') || '').toUpperCase();

    // ===== CONNECTION =====
    socket.on('connect', () => {
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Verbunden';
    });

    socket.on('disconnect', () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = 'Getrennt';
    });

    // ===== HELPER =====
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showError(msg) {
        document.getElementById('joinError').textContent = msg;
    }

    // ===== JOIN =====
    function joinGame() {
        const nameInput = document.getElementById('nameInput');
        const name = nameInput.value.trim();

        if (!name) {
            showError('Bitte Namen eingeben!');
            return;
        }

        if (!roomCode) {
            showError('Kein Raumcode in der URL! Bitte QR Code scannen.');
            return;
        }

        document.getElementById('joinBtn').disabled = true;
        showError('');

        socket.emit('joinGame', { name, code: roomCode }, (response) => {
            document.getElementById('joinBtn').disabled = false;

            if (!response) {
                showError('Keine Antwort vom Server.');
                return;
            }

            if (response.success) {
                myName = response.name;
                document.getElementById('waitPlayerName').textContent = myName;
                showScreen('waitScreen');
            } else {
                showError(response.error || 'Fehler beim Beitreten.');
            }
        });
    }

    // Enter Taste
    document.getElementById('nameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinGame();
    });

    // ===== NEUE FRAGE =====
    socket.on('newQuestion', (data) => {
        currentMaxTime = data.timeLeft || 20;
        showScreen('questionScreen');

        document.getElementById('questionCounter').textContent =
            `Frage ${data.index + 1} / ${data.total}`;
        document.getElementById('questionText').textContent = data.text;
        document.getElementById('timerNumber').textContent = data.timeLeft;

        // Timer Reset
        const progress = document.getElementById('timerProgress');
        const circumference = 163.4;
        progress.style.strokeDashoffset = '0';

        // Bild
        const img = document.getElementById('questionImage');
        if (data.image) {
            img.src = data.image;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }

        // Antworten
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';

        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12'];
        const labels = ['A', 'B', 'C', 'D'];

        data.options.forEach((opt, i) => {
            if (opt) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.style.background = colors[i];
                btn.textContent = `${labels[i]}: ${opt}`;
                btn.onclick = () => submitAnswer(i, btn);
                grid.appendChild(btn);
            }
        });
    });

    // ===== TIMER =====
    socket.on('timerUpdate', (data) => {
        const { timeLeft } = data;
        document.getElementById('timerNumber').textContent = timeLeft;

        const circumference = 163.4;
        const progress = document.getElementById('timerProgress');
        const offset = circumference * (1 - timeLeft / currentMaxTime);
        progress.style.strokeDashoffset = offset;

        // Farbe wechseln
        if (timeLeft <= 5) {
            progress.style.stroke = '#ff4444';
        } else if (timeLeft <= 10) {
            progress.style.stroke = '#ffaa00';
        } else {
            progress.style.stroke = '#e94560';
        }
    });

    // ===== ANTWORT SENDEN =====
    function submitAnswer(index, btn) {
        // Alle Buttons deaktivieren
        document.querySelectorAll('.option-btn').forEach(b => {
            b.disabled = true;
        });
        btn.classList.add('selected');

        const timerNumber = document.getElementById('timerNumber');
        const timeLeft = parseInt(timerNumber.textContent) || 0;

        socket.emit('submitAnswer', { answer: index, timeLeft }, (response) => {
            if (!response) return;
            // Warte auf questionEnd
        });
    }

    // ===== FRAGE ENDE =====
    socket.on('questionEnd', (data) => {
        const { correct, leaderboard } = data;

        // Richtige Antwort hervorheben
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, i) => {
            if (i === correct) {
                btn.style.background = '#44ff88';
                btn.style.color = '#000';
            }
        });

        // Nach 2 Sekunden Ergebnis zeigen
        setTimeout(() => {
            showResult(correct, leaderboard);
        }, 2000);
    });

    // ===== ERGEBNIS ZEIGEN =====
    function showResult(correct, leaderboard) {
        // Prüfen ob Spieler richtig lag
        // (wird anhand des Scores berechnet)
        const myEntry = leaderboard.find(p => p.name === myName);
        const myRank = myEntry ? myEntry.rank : '-';

        showScreen('resultScreen');

        // Nach 3 Sekunden Leaderboard
        setTimeout(() => {
            showLeaderboard(leaderboard);
        }, 3000);
    }

    // ===== LEADERBOARD =====
    function showLeaderboard(leaderboard) {
        showScreen('leaderboardScreen');
        const list = document.getElementById('leaderboardList');
        list.innerHTML = '';

        leaderboard.forEach(player => {
            const li = document.createElement('li');
            if (player.name === myName) li.classList.add('me');

            const medals = ['🥇', '🥈', '🥉'];
            const rankDisplay = medals[player.rank - 1] || `#${player.rank}`;

            li.innerHTML = `
                <span class="rank-num">${rankDisplay}</span>
                <span>${escapeHtml(player.name)}</span>
                <span class="player-score">${player.score} Pts</span>
            `;
            list.appendChild(li);
        });
    }

    // ===== SPIEL BEENDET =====
    socket.on('gameFinished', (data) => {
        const { leaderboard } = data;
        showScreen('finishScreen');
        startConfetti();

        // Podium
        const podium = document.getElementById('finishPodium');
        podium.innerHTML = '';

        const podiumOrder = [1, 0, 2]; // 2. Platz links, 1. Platz mitte, 3. Platz rechts
        const heights = [100, 140, 80];
        const medals = ['🥇', '🥈', '🥉'];

        podiumOrder.forEach((pos, i) => {
            if (leaderboard[pos]) {
                const item = document.createElement('div');
                item.className = 'podium-item';
                item.innerHTML = `
                    <div class="podium-block" style="height:${heights[i]}px">
                        ${medals[pos]}
                    </div>
                    <div class="podium-name">${escapeHtml(leaderboard[pos].name)}</div>
                    <div style="font-size:0.8em; opacity:0.8">${leaderboard[pos].score} Pts</div>
                `;
                podium.appendChild(item);
            }
        });

        // Finale Liste
        showFinalLeaderboard(leaderboard);
    });

    function showFinalLeaderboard(leaderboard) {
        const list = document.getElementById('finalLeaderboard');
        list.innerHTML = '';

        leaderboard.forEach(player => {
            const li = document.createElement('li');
            if (player.name === myName) li.classList.add('me');
            li.innerHTML = `
                <span class="rank-num">#${player.rank}</span>
                <span>${escapeHtml(player.name)}</span>
                <span class="player-score">${player.score} Pts</span>
            `;
            list.appendChild(li);
        });
    }

    // ===== SPIEL RESET =====
    socket.on('gameReset', () => {
        myScore = 0;
        showScreen('waitScreen');
    });

    // ===== KONFETTI =====
    function startConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const confetti = Array.from({length: 150}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            r: Math.random() * 8 + 4,
            d: Math.random() * 150,
            color: `hsl(${Math.random() * 360}, 90%, 60%)`,
            tilt: Math.random() * 10 - 10,
            tiltAngle: 0,
            tiltSpeed: Math.random() * 0.1 + 0.05
        }));

        let frame = 0;
        const maxFrames = 300;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            confetti.forEach(c => {
                ctx.beginPath();
                ctx.fillStyle = c.color;
                ctx.ellipse(c.x, c.y, c.r, c.r * 0.4, c.tilt, 0, Math.PI * 2);
                ctx.fill();

                c.y += 3 + Math.sin(c.d) * 2;
                c.x += Math.sin(c.d) * 1.5;
                c.tiltAngle += c.tiltSpeed;
                c.tilt = Math.sin(c.tiltAngle) * 12;

                if (c.y > canvas.height) {
                    c.y = -10;
                    c.x = Math.random() * canvas.width;
                }
            });

            frame++;
            if (frame < maxFrames) requestAnimationFrame(draw);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        draw();
    }
</script>
</body>
</html>
