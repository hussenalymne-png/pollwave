<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollWave</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.screen{width:100%;max-width:480px;display:none;flex-direction:column;align-items:center;gap:16px}
.screen.active{display:flex}
.logo{font-size:32px;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:24px;width:100%}
h1{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
h2{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
p{color:#888;font-size:14px;text-align:center}
input{width:100%;padding:12px 16px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:10px;color:#e0e0e0;font-size:16px;margin-bottom:12px;font-family:inherit}
input:focus{outline:none;border-color:#667eea}
.btn{width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;font-size:16px;font-weight:700;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-secondary{background:#2a2a4a;color:#e0e0e0}

/* Waiting */
.room-code{font-size:36px;font-weight:900;letter-spacing:6px;color:#667eea;font-family:monospace;text-align:center;padding:16px;background:#0f0f1a;border-radius:12px}
.player-count{font-size:48px;font-weight:900;color:#764ba2;text-align:center}
.waiting-dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#667eea;margin:2px;animation:dot .8s infinite alternate}
.waiting-dots span:nth-child(2){animation-delay:.2s}
.waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}

/* Question */
.question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.question-num{font-size:12px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.timer-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
.timer-wrap svg{transform:rotate(-90deg)}
.timer-wrap circle{fill:none;stroke:#2a2a4a;stroke-width:4}
.timer-wrap circle.prog{stroke:#667eea;stroke-width:4;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .5s}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#e0e0e0}
.question-text{font-size:18px;font-weight:700;text-align:center;line-height:1.4;margin-bottom:16px}
.question-image{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:16px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-btn{padding:16px 10px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-size:15px;font-weight:600;text-align:center;transition:all .2s;color:#fff;position:relative}
.option-btn:disabled{cursor:not-allowed;opacity:.7}
.option-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.opt-0{background:#e74c3c}
.opt-1{background:#3498db}
.opt-2{background:#2ecc71}
.opt-3{background:#f39c12}
.opt-label{display:block;font-size:11px;opacity:.8;margin-bottom:4px}
.opt-selected{box-shadow:0 0 0 3px #fff}

/* Result */
.result-icon{font-size:64px;text-align:center}
.result-correct{color:#2ecc71}
.result-wrong{color:#e74c3c}
.points-display{font-size:48px;font-weight:900;text-align:center;color:#667eea}
.points-label{font-size:14px;color:#888;text-align:center;margin-top:-8px}
.score-display{font-size:20px;font-weight:700;text-align:center;color:#764ba2}

/* Leaderboard */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:24px;height:140px}
.podium-place{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium-name{font-size:13px;font-weight:700;text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium-score{font-size:11px;color:#888}
.podium-block{width:80px;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff}
.p1-block{background:linear-gradient(135deg,#f1c40f,#e67e22);height:100px}
.p2-block{background:linear-gradient(135deg,#95a5a6,#7f8c8d);height:70px}
.p3-block{background:linear-gradient(135deg,#cd7f32,#a05c1e);height:50px}
.leaderboard-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.lb-item{background:#0f0f1a;border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.lb-rank{font-size:16px;font-weight:800;min-width:28px;color:#888}
.lb-name{flex:1;font-size:14px;font-weight:600}
.lb-score{font-size:14px;font-weight:700;color:#667eea}
canvas#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

.alert{padding:12px 16px;border-radius:10px;font-size:14px;text-align:center;width:100%}
.alert-error{background:#3a1a1a;border:1px solid #e74c3c;color:#e74c3c}
.alert-info{background:#1a2a3a;border:1px solid #667eea;color:#667eea}
</style>
</head>
<body>

<canvas id="confetti" style="display:none"></canvas>

<!-- JOIN -->
<div class="screen active" id="screen-join">
  <div class="logo">⚡ PollWave</div>
  <div class="card">
    <h2>Spiel beitreten</h2>
    <input type="text" id="joinCode" placeholder="Room-Code" maxlength="6"
      style="text-transform:uppercase;letter-spacing:4px;font-size:22px;text-align:center">
    <input type="text" id="joinName" placeholder="Dein Name" maxlength="20">
    <button class="btn btn-primary" id="btnJoin" onclick="joinGame()">Beitreten</button>
    <div id="joinError" style="margin-top:12px"></div>
  </div>
</div>

<!-- WAITING -->
<div class="screen" id="screen-waiting">
  <div class="logo">⚡ PollWave</div>
  <div class="card" style="text-align:center">
    <p style="margin-bottom:8px;font-size:13px;color:#888">Room-Code</p>
    <div class="room-code" id="waitCode"></div>
    <hr style="border-color:#2a2a4a;margin:16px 0">
    <div class="player-count" id="waitCount">0</div>
    <p style="margin-top:4px">Spieler online</p>
    <div class="waiting-dots" style="text-align:center;margin-top:16px">
      <span></span><span></span><span></span>
    </div>
    <p style="margin-top:12px;font-size:13px">Warte auf den Admin…</p>
  </div>
</div>

<!-- QUESTION -->
<div class="screen" id="screen-question">
  <div class="card">
    <div class="question-header">
      <span class="question-num" id="qNum">Frage 1/1</span>
      <div class="timer-wrap">
        <svg width="56" height="56" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="25"/>
          <circle class="prog" id="timerCircle" cx="28" cy="28" r="25"/>
        </svg>
        <div class="timer-text" id="timerText">30</div>
      </div>
    </div>
    <img id="qImage" class="question-image" src="" alt="" style="display:none">
    <div class="question-text" id="qText"></div>
    <div class="options" id="optionsGrid"></div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="card">
    <div class="result-icon" id="resultIcon">✓</div>
    <div class="points-display" id="resultPoints">+0</div>
    <div class="points-label" id="resultLabel">Punkte</div>
    <div class="score-display" id="resultScore" style="margin-top:12px"></div>
    <hr style="border-color:#2a2a4a;margin:16px 0">
    <p id="resultWait" style="font-size:13px">Warte auf nächste Frage…</p>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="screen" id="screen-leaderboard">
  <div class="logo">⚡ PollWave</div>
  <div class="card">
    <h2>🏆 Ergebnis</h2>
    <div class="podium" id="podium"></div>
    <div class="leaderboard-list" id="lbList"></div>
    <button class="btn btn-secondary" style="margin-top:16px" onclick="playAgain()">Neues Spiel</button>
  </div>
</div>

<script>
const socket = io();
let myName    = '';
let myCode    = '';
let myScore   = 0;
let maxTime   = 30;
let timeLeft  = 30;
let selectedAnswer = null;
let timerAnim = null;

// ─── Screens ─────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

// ─── URL params ──────────────────────────────────────────
window.addEventListener('load', () => {
  const p = new URLSearchParams(location.search);
  if (p.get('code')) document.getElementById('joinCode').value = p.get('code').toUpperCase();
});

// ─── Join ────────────────────────────────────────────────
function joinGame() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const name = document.getElementById('joinName').value.trim();
  const err  = document.getElementById('joinError');
  err.innerHTML = '';
  if (!code || code.length !== 6) {
    err.innerHTML = '<div class="alert alert-error">Bitte 6-stelligen Code eingeben.</div>'; return;
  }
  if (!name) {
    err.innerHTML = '<div class="alert alert-error">Bitte Namen eingeben.</div>'; return;
  }
  myName = name;
  myCode = code;
  document.getElementById('btnJoin').disabled = true;
  socket.emit('joinGame', { code, name });
}

// ─── Socket ──────────────────────────────────────────────
socket.on('roomJoined', d => {
  document.getElementById('btnJoin').disabled = false;
  if (d.status === 'finished') {
    document.getElementById('joinError').innerHTML =
      '<div class="alert alert-error">Dieses Spiel ist bereits beendet.</div>'; return;
  }
  document.getElementById('waitCode').textContent  = d.code;
  document.getElementById('waitCount').textContent = d.playerCount;
  show('waiting');
});

socket.on('playerUpdate', d => {
  document.getElementById('waitCount').textContent = d.count;
});

socket.on('gameStarted', () => {
  myScore = 0;
  selectedAnswer = null;
});

socket.on('newQuestion', d => {
  selectedAnswer = null;
  maxTime  = d.time || 30;
  timeLeft = maxTime;

  document.getElementById('qNum').textContent = `Frage ${d.index+1}/${d.total}`;
  document.getElementById('qText').textContent = d.question;

  const img = document.getElementById('qImage');
  if (d.image && d.imagePosition !== 'background') {
    img.src = d.image;
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }

  const colors = ['opt-0','opt-1','opt-2','opt-3'];
  const labels = ['A','B','C','D'];
  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = d.options.map((o,i) => `
    <button class="option-btn ${colors[i]}" onclick="submitAnswer(${i})">
      <span class="opt-label">${labels[i]}</span>${o}
    </button>`).join('');

  updateTimerCircle(maxTime, maxTime);
  document.getElementById('timerText').textContent = maxTime;
  show('question');
});

socket.on('timerUpdate', d => {
  timeLeft = d.timeLeft;
  document.getElementById('timerText').textContent = d.timeLeft;
  updateTimerCircle(d.timeLeft, d.maxTime || maxTime);
  if (d.timeLeft <= 5) {
    document.getElementById('timerCircle').style.stroke = '#e74c3c';
  } else if (d.timeLeft <= 10) {
    document.getElementById('timerCircle').style.stroke = '#f39c12';
  } else {
    document.getElementById('timerCircle').style.stroke = '#667eea';
  }
});

socket.on('answerResult', d => {
  myScore = d.score || myScore;
  const correct = d.correct;
  const points  = d.points || 0;

  document.getElementById('resultIcon').textContent  = correct ? '✅' : '❌';
  document.getElementById('resultPoints').textContent= correct ? `+${points}` : '+0';
  document.getElementById('resultPoints').style.color= correct ? '#2ecc71' : '#e74c3c';
  document.getElementById('resultLabel').textContent = correct ? 'Punkte verdient!' : 'Leider falsch';
  document.getElementById('resultScore').textContent = `Gesamt: ${myScore} Punkte`;
  document.getElementById('resultWait').textContent  = 'Warte auf nächste Frage…';

  setTimeout(() => show('result'), 1500);
});

socket.on('questionEnd', d => {
  // highlight correct answer if player didn't answer
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((b,i) => {
    b.disabled = true;
    if (i === d.correctAnswer) b.style.boxShadow = '0 0 0 4px #2ecc71';
  });
  if (selectedAnswer === null) {
    document.getElementById('resultIcon').textContent   = '⏰';
    document.getElementById('resultPoints').textContent = '+0';
    document.getElementById('resultPoints').style.color = '#888';
    document.getElementById('resultLabel').textContent  = 'Zeit abgelaufen!';
    document.getElementById('resultScore').textContent  = `Gesamt: ${myScore} Punkte`;
    document.getElementById('resultWait').textContent   = 'Warte auf nächste Frage…';
    setTimeout(() => show('result'), 1500);
  }
});

socket.on('gameEnd', d => {
  showLeaderboard(d.leaderboard || []);
});

socket.on('gameReset', () => {
  myScore = 0;
  selectedAnswer = null;
  show('waiting');
});

socket.on('error', d => {
  document.getElementById('btnJoin').disabled = false;
  document.getElementById('joinError').innerHTML =
    `<div class="alert alert-error">${d.message}</div>`;
  show('join');
});

// ─── Answer ──────────────────────────────────────────────
function submitAnswer(i) {
  if (selectedAnswer !== null) return;
  selectedAnswer = i;
  document.querySelectorAll('.option-btn').forEach((b,j) => {
    b.disabled = true;
    if (j === i) b.classList.add('opt-selected');
  });
  socket.emit('submitAnswer', { code: myCode, answer: i });
}

// ─── Timer Circle ────────────────────────────────────────
function updateTimerCircle(left, max) {
  const circ = 2 * Math.PI * 25;
  const offset = circ - (left / max) * circ;
  document.getElementById('timerCircle').style.strokeDashoffset = offset;
}

// ─── Leaderboard ─────────────────────────────────────────
function showLeaderboard(lb) {
  const podiumEl = document.getElementById('podium');
  const listEl   = document.getElementById('lbList');

  // Podium (order: 2nd, 1st, 3rd)
  const order = [1,0,2];
  const blocks = ['p2-block','p1-block','p3-block'];
  const medals = ['🥈','🥇','🥉'];
  podiumEl.innerHTML = order.map(rank => {
    const p = lb[rank];
    if (!p) return '<div class="podium-place"></div>';
    return `
      <div class="podium-place">
        <div class="podium-name">${p.name}</div>
        <div class="podium-score">${p.score} Pts</div>
        <div class="podium-block ${blocks[order.indexOf(rank)]}">${medals[order.indexOf(rank)]}</div>
      </div>`;
  }).join('');

  // Full list
  listEl.innerHTML = lb.map((p,i) => `
    <div class="lb-item">
      <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name">${p.name}</div>
      <div class="lb-score">${p.score} Pts</div>
    </div>`).join('');

  show('leaderboard');
  startConfetti();
}

// ─── Confetti ────────────────────────────────────────────
function startConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx    = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const pieces = Array.from({length:160}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: 8 + Math.random() * 8,
    h: 4 + Math.random() * 6,
    r: Math.random() * Math.PI * 2,
    rv: (Math.random() - .5) * .1,
    vx: (Math.random() - .5) * 2,
    vy: 2 + Math.random() * 3,
    color: `hsl(${Math.random()*360},80%,60%)`
  }));

  let frame = 0;
  function draw() {
    if (frame++ > 400) { canvas.style.display='none'; return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x  += p.vx;
      p.y  += p.vy;
      p.r  += p.rv;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random()*canvas.width; }
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ─── Play Again ──────────────────────────────────────────
function playAgain() {
  show('join');
  document.getElementById('joinName').value = myName;
  document.getElementById('joinCode').value = '';
  myScore = 0;
}
</script>
</body>
</html>
