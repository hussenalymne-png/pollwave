<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PollWave Admin</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #FF6600;
      box-shadow: 0 2px 20px rgba(255,102,0,0.3);
    }
    .header img { height: 40px; }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-badge {
      margin-left: auto;
      background: rgba(255,102,0,0.2);
      border: 1px solid #FF6600;
      color: #FF6600;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ── Login ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 74px);
      padding: 20px;
      gap: 20px;
    }
    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,102,0,0.3);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-card h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-card p { color: #aaa; margin-bottom: 28px; font-size: 14px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255,255,255,0.05);
      padding: 6px;
      border-radius: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      background: transparent;
      color: #aaa;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #FF6600, #e55a00);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255,102,0,0.4);
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #FF6600;
      background: rgba(255,102,0,0.1);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(255,102,0,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,102,0,0.5); }

    /* ── Saved Rooms ── */
    .saved-rooms-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(78,205,196,0.3);
      border-radius: 24px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .saved-rooms-card h3 {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #4ECDC4;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .saved-room-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .saved-room-item:hover {
      border-color: rgba(255,102,0,0.4);
      background: rgba(255,102,0,0.05);
    }
    .saved-room-code {
      font-size: 18px;
      font-weight: 900;
      color: #FF6600;
      letter-spacing: 2px;
      width: 70px;
      flex-shrink: 0;
    }
    .saved-room-name {
      flex: 1;
      font-size: 14px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .saved-room-date {
      font-size: 11px;
      color: #666;
      flex-shrink: 0;
    }
    .btn-open-room {
      padding: 6px 14px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-open-room:hover { transform: translateY(-1px); }
    .btn-delete-room {
      padding: 6px 10px;
      background: rgba(231,76,60,0.2);
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 8px;
      color: #e74c3c;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-delete-room:hover { background: rgba(231,76,60,0.3); }
    .no-saved-rooms {
      text-align: center;
      color: #555;
      font-size: 14px;
      padding: 16px 0;
    }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 24px 32px; max-width: 1200px; margin: 0 auto; }

    .room-banner {
      background: linear-gradient(135deg, rgba(255,102,0,0.2), rgba(78,205,196,0.2));
      border: 1px solid rgba(255,102,0,0.4);
      border-radius: 20px;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .room-code-display { font-size: 48px; font-weight: 900; color: #FF6600; letter-spacing: 4px; }
    .room-meta { color: #aaa; font-size: 14px; margin-top: 4px; }

    .quiz-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .quiz-name-input {
      padding: 10px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      width: 260px;
    }
    .quiz-name-input:focus { outline: none; border-color: #FF6600; }
    .btn-save-name {
      padding: 10px 20px;
      background: linear-gradient(135deg, #4ECDC4, #2bb5ac);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-save-name:hover { transform: translateY(-1px); }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .stat-card .stat-value { font-size: 36px; font-weight: 900; color: #FF6600; }
    .stat-card .stat-label { font-size: 12px; color: #aaa; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    .controls-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .btn-control {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start   { background: linear-gradient(135deg, #4ECDC4, #2bb5ac); color: #fff; }
    .btn-next    { background: linear-gradient(135deg, #FF6600, #e55a00); color: #fff; }
    .btn-end     { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
    .btn-reset   { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-present { background: linear-gradient(135deg, #9b59b6, #8e44ad); color: #fff; margin-left: auto; }
    .btn-control:hover    { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .btn-control:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Questions ── */
    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .question-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }

    .question-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .question-card:hover { border-color: rgba(255,102,0,0.4); }

    .question-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }
    .q-number {
      background: linear-gradient(135deg, #FF6600, #e55a00);
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; flex-shrink: 0;
    }
    .q-title  { flex: 1; font-weight: 600; font-size: 15px; }
    .q-meta   { color: #aaa; font-size: 13px; }
    .q-toggle { color: #aaa; font-size: 18px; transition: transform 0.2s; }
    .question-card.open .q-toggle { transform: rotate(180deg); }

    .question-body { display: none; padding: 0 20px 20px; }
    .question-card.open .question-body { display: block; }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .input-field:focus { outline: none; border-color: #FF6600; }

    .options-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .option-row   { display: flex; align-items: center; gap: 8px; }
    .option-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .option-input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    .option-input:focus  { outline: none; border-color: #FF6600; }
    .option-correct { width: 20px; height: 20px; cursor: pointer; accent-color: #4ECDC4; }

    .time-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .preset-btn {
      padding: 6px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover,
    .preset-btn.active {
      background: rgba(255,102,0,0.2);
      border-color: #FF6600;
      color: #FF6600;
    }

    /* ── Image Section ── */
    .image-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .image-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #4ECDC4;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .image-upload-area {
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
      position: relative;
    }
    .image-upload-area:hover { border-color: #FF6600; background: rgba(255,102,0,0.05); }
    .image-preview { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 10px; object-fit: contain; }

    /* Image controls grid */
    .img-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
    .img-control-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .img-control-group select {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .img-control-group select:focus { outline: none; border-color: #FF6600; }
    .img-control-group select option { background: #1a1a2e; }

    /* Chip-style buttons for image settings */
    .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #ccc;
      transition: all 0.15s;
    }
    .chip:hover { border-color: #FF6600; color: #FF6600; }
    .chip.active {
      background: rgba(255,102,0,0.25);
      border-color: #FF6600;
      color: #FF6600;
    }

    .btn-remove-image {
      padding: 7px 16px;
      background: rgba(231,76,60,0.15);
      border: 1px solid rgba(231,76,60,0.3);
      border-radius: 8px;
      color: #e74c3c;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .btn-remove-image:hover { background: rgba(231,76,60,0.25); }

    .row-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-delete {
      padding: 8px 16px;
      background: rgba(231,76,60,0.2);
      border: 1px solid rgba(231,76,60,0.4);
      border-radius: 8px;
      color: #e74c3c;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover { background: rgba(231,76,60,0.3); }

    .btn-add-question {
      width: 100%;
      padding: 14px;
      background: rgba(78,205,196,0.1);
      border: 2px dashed rgba(78,205,196,0.4);
      border-radius: 16px;
      color: #4ECDC4;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add-question:hover { background: rgba(78,205,196,0.2); border-color: #4ECDC4; }

    .btn-save-questions {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(255,102,0,0.3);
    }
    .btn-save-questions:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,102,0,0.5); }

    /* ── Leaderboard ── */
    .leaderboard { margin-top: 24px; }
    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .lb-rank  { font-size: 20px; width: 32px; text-align: center; }
    .lb-name  { flex: 1; font-weight: 600; }
    .lb-score { color: #FF6600; font-weight: 800; }

    /* ── QR ── */
    .qr-section {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    #qrCode img { border-radius: 12px; margin-top: 10px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      .header { padding: 12px 16px; }
      #dashboard { padding: 16px; }
      .room-code-display { font-size: 36px; }
      .controls-row { flex-direction: column; }
      .btn-control { width: 100%; }
      .btn-present { margin-left: 0; }
      .img-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Galaxus_logo.svg/1200px-Galaxus_logo.svg.png" alt="Galaxus" />
  <h1>PollWave Admin</h1>
  <span class="header-badge">🛠 Admin</span>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Erstelle oder verwalte dein Quiz</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('new')">➕ Neuer Raum</button>
      <button class="tab-btn" onclick="switchTab('rejoin')">🔄 Rejoinen</button>
    </div>
    <div id="tabNew">
      <div class="form-group">
        <label>Quiz Name</label>
        <input type="text" id="newQuizName" placeholder="z.B. Onboarding Q1 2025" />
      </div>
      <div class="form-group">
        <label>Admin Passwort</label>
        <input type="password" id="newPassword" placeholder="Passwort eingeben" />
      </div>
      <button class="btn-primary" onclick="createRoom()">🚀 Raum erstellen</button>
    </div>
    <div id="tabRejoin" style="display:none">
      <div class="form-group">
        <label>Raum Code</label>
        <input type="text" id="rejoinCode" placeholder="z.B. ABC123" maxlength="6" style="text-transform:uppercase" />
      </div>
      <div class="form-group">
        <label>Admin Passwort</label>
        <input type="password" id="rejoinPassword" placeholder="Passwort eingeben" />
      </div>
      <button class="btn-primary" onclick="rejoinRoom()">🔄 Rejoinen</button>
    </div>
  </div>

  <div class="saved-rooms-card" id="savedRoomsCard">
    <h3>💾 Gespeicherte Räume</h3>
    <div id="savedRoomsList">
      <div class="no-saved-rooms">Noch keine Räume gespeichert</div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="room-banner">
    <div>
      <div class="room-code-display" id="displayCode">------</div>
      <div class="room-meta" id="displayMeta">0 Spieler · 0 Fragen</div>
    </div>
    <div>
      <div class="quiz-name-row">
        <input type="text" class="quiz-name-input" id="quizNameInput" placeholder="Quiz Name" />
        <button class="btn-save-name" onclick="saveQuizName()">💾 Speichern</button>
      </div>
    </div>
  </div>

  <div class="qr-section">
    <div style="font-weight:700; margin-bottom:8px;">📱 QR Code für Spieler</div>
    <div id="qrCode"></div>
    <div style="color:#aaa; font-size:13px; margin-top:8px;" id="joinUrl"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statPlayers">0</div>
      <div class="stat-label">Spieler</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statQuestions">0</div>
      <div class="stat-label">Fragen</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statCurrent">-</div>
      <div class="stat-label">Aktuelle Frage</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statState">⏳</div>
      <div class="stat-label">Status</div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn-control btn-start"   id="btnStart"   onclick="startGame()">▶ Start</button>
    <button class="btn-control btn-next"    id="btnNext"    onclick="nextQuestion()" disabled>⏭ Nächste Frage</button>
    <button class="btn-control btn-end"     id="btnEnd"     onclick="endGame()" disabled>⏹ Beenden</button>
    <button class="btn-control btn-reset"   id="btnReset"   onclick="resetGame()">🔄 Reset</button>
    <button class="btn-control btn-present" id="btnPresent" onclick="openPresentation()">🖥️ Präsentation</button>
  </div>

  <div class="section-title">📝 Fragen</div>
  <div class="question-list" id="questionList"></div>
  <button class="btn-add-question" onclick="addQuestion()">➕ Frage hinzufügen</button>
  <button class="btn-save-questions" onclick="saveQuestions()">💾 Fragen speichern</button>

  <div class="leaderboard" id="leaderboardSection" style="display:none">
    <div class="section-title">🏆 Rangliste</div>
    <div id="leaderboardList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const socket = io();
  let roomCode = '';
  let adminPassword = '';
  let questions = [];
  let gameState = 'waiting';
  let currentQuizName = 'PollWave Quiz';

  const OPTION_COLORS = ['#e74c3c','#3498db','#f1c40f','#2ecc71'];
  const MAX_SAVED_ROOMS = 10;
  const STORAGE_KEY = 'pollwave_saved_rooms';

  // ── Tabs ──
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) =>
      b.classList.toggle('active', (tab==='new'&&i===0)||(tab==='rejoin'&&i===1)));
    document.getElementById('tabNew').style.display    = tab === 'new'    ? 'block' : 'none';
    document.getElementById('tabRejoin').style.display = tab === 'rejoin' ? 'block' : 'none';
  }

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Saved Rooms ──
  function getSavedRooms() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }
  function saveRoomToStorage(code, quizName) {
    let rooms = getSavedRooms().filter(r => r.code !== code);
    rooms.unshift({ code, quizName: quizName || 'PollWave Quiz', date: new Date().toLocaleDateString('de-CH') });
    if (rooms.length > MAX_SAVED_ROOMS) rooms = rooms.slice(0, MAX_SAVED_ROOMS);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
    renderSavedRooms();
  }
  function deleteSavedRoom(code) {
    let rooms = getSavedRooms().filter(r => r.code !== code);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms));
    renderSavedRooms();
    showToast('🗑 Raum entfernt');
  }
  function renderSavedRooms() {
    const rooms = getSavedRooms();
    const list  = document.getElementById('savedRoomsList');
    if (!rooms.length) {
      list.innerHTML = '<div class="no-saved-rooms">Noch keine Räume gespeichert</div>';
      return;
    }
    list.innerHTML = rooms.map(r => `
      <div class="saved-room-item">
        <div class="saved-room-code">${r.code}</div>
        <div class="saved-room-name">${escHtml(r.quizName)}</div>
        <div class="saved-room-date">${r.date}</div>
        <button class="btn-open-room" onclick="quickRejoin('${r.code}')">▶ Öffnen</button>
        <button class="btn-delete-room" onclick="deleteSavedRoom('${r.code}')">🗑</button>
      </div>`).join('');
  }
  function quickRejoin(code) {
    switchTab('rejoin');
    document.getElementById('rejoinCode').value = code;
    document.getElementById('rejoinPassword').focus();
    showToast('🔑 Passwort eingeben und Rejoinen');
  }

  // ── Presentation ──
  function openPresentation() {
    if (!roomCode) return showToast('❌ Kein aktiver Raum');
    window.open(`${window.location.origin}/present.html?room=${roomCode}`, '_blank');
  }

  // ── Create / Rejoin ──
  async function createRoom() {
    const quizName = document.getElementById('newQuizName').value.trim() || 'PollWave Quiz';
    const password = document.getElementById('newPassword').value.trim();
    if (!password) return showToast('❌ Passwort eingeben');
    const res  = await fetch('/api/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, quizName })
    });
    const data = await res.json();
    if (!res.ok) return showToast('❌ ' + data.error);
    adminPassword   = password;
    currentQuizName = quizName;
    saveRoomToStorage(data.code, quizName);
    initDashboard(data.code, quizName, [], 'waiting', -1, []);
  }

  async function rejoinRoom() {
    const code     = document.getElementById('rejoinCode').value.trim().toUpperCase();
    const password = document.getElementById('rejoinPassword').value.trim();
    if (!code || !password) return showToast('❌ Alle Felder ausfüllen');
    const res  = await fetch(`/api/rooms/${code}/rejoin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await res.json();
    if (!res.ok) return showToast('❌ ' + data.error);
    adminPassword   = password;
    currentQuizName = data.quizName || 'PollWave Quiz';
    saveRoomToStorage(data.code, currentQuizName);
    initDashboard(data.code, currentQuizName, data.questions || [], data.state, data.currentQuestion, data.players || []);
  }

  function initDashboard(code, quizName, qs, state, currentQ, players) {
    roomCode  = code;
    questions = qs;
    gameState = state;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display   = 'block';
    document.getElementById('displayCode').textContent   = code;
    document.getElementById('quizNameInput').value       = quizName;
    generateQR(code);
    renderQuestions();
    updateStats(players.length, qs.length, currentQ, state);
    updateButtons(state);
    socket.emit('joinRoom', { code, name: '__presenter__' });
  }

  // ── QR ──
  function generateQR(code) {
    const url = `${window.location.origin}?code=${code}`;
    document.getElementById('joinUrl').textContent = url;
    document.getElementById('qrCode').innerHTML =
      `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(url)}" />`;
  }

  // ── Quiz Name ──
  async function saveQuizName() {
    const name = document.getElementById('quizNameInput').value.trim();
    if (!name) return showToast('❌ Name eingeben');
    const res = await fetch(`/api/rooms/${roomCode}/name`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword, quizName: name })
    });
    if (res.ok) {
      currentQuizName = name;
      saveRoomToStorage(roomCode, name);
      showToast('✅ Quiz Name gespeichert');
    } else {
      showToast('❌ Fehler beim Speichern');
    }
  }

  // ── Stats & Buttons ──
  function updateStats(players, qCount, currentQ, state) {
    document.getElementById('statPlayers').textContent   = players;
    document.getElementById('statQuestions').textContent = qCount;
    document.getElementById('statCurrent').textContent   = currentQ >= 0 ? `${currentQ+1}/${qCount}` : '-';
    document.getElementById('statState').textContent     = state === 'waiting' ? '⏳' : state === 'playing' ? '▶' : '✅';
    document.getElementById('displayMeta').textContent   = `${players} Spieler · ${qCount} Fragen`;
  }
  function updateButtons(state) {
    gameState = state;
    document.getElementById('btnStart').disabled = state !== 'waiting';
    document.getElementById('btnNext').disabled  = state !== 'playing';
    document.getElementById('btnEnd').disabled   = state !== 'playing';
  }

  // ── Game Controls ──
  function startGame()    { socket.emit('startGame',         { code: roomCode, password: adminPassword }); }
  function nextQuestion() { socket.emit('adminNextQuestion', { code: roomCode, password: adminPassword }); }
  function endGame()      { socket.emit('endGame',           { code: roomCode, password: adminPassword }); }
  function resetGame()    { socket.emit('resetGame',         { code: roomCode, password: adminPassword }); }

  // ── Questions Render ──
  function renderQuestions() {
    const list = document.getElementById('questionList');
    list.innerHTML = '';
    questions.forEach((q, i) => list.appendChild(buildQuestionCard(q, i)));
    document.getElementById('statQuestions').textContent = questions.length;
  }

  // ── Image Settings Chips ──
  function setImageProp(i, prop, value) {
    questions[i][prop] = value;
    // Update chip UI
    const group = document.querySelectorAll(`[data-q="${i}"][data-prop="${prop}"]`);
    group.forEach(chip => chip.classList.toggle('active', chip.dataset.val === value));
  }

  function buildQuestionCard(q, i) {
    const card = document.createElement('div');
    card.className = 'question-card';

    // Defaults for image settings
    const imgPos  = q.imagePosition || 'right';
    const imgSize = q.imageSize     || 'medium';
    const imgFit  = q.imageFit      || 'cover';

    const posOptions  = [
      { v:'left',       l:'◀ Links' },
      { v:'right',      l:'▶ Rechts' },
      { v:'top',        l:'▲ Oben' },
      { v:'bottom',     l:'▼ Unten' },
      { v:'background', l:'🖼 Hintergrund' }
    ];
    const sizeOptions = [
      { v:'small',  l:'S' },
      { v:'medium', l:'M' },
      { v:'large',  l:'L' },
      { v:'full',   l:'Full' }
    ];
    const fitOptions  = [
      { v:'cover',   l:'Cover' },
      { v:'contain', l:'Contain' },
      { v:'fill',    l:'Fill' }
    ];

    card.innerHTML = `
      <div class="question-header" onclick="toggleCard(${i})">
        <div class="q-number">${i+1}</div>
        <div class="q-title">${q.question || 'Neue Frage'}</div>
        <div class="q-meta">⏱ ${q.time||30}s</div>
        <div class="q-toggle">▼</div>
      </div>
      <div class="question-body">
        <input class="input-field" placeholder="Frage eingeben…" value="${escHtml(q.question||'')}"
          oninput="questions[${i}].question=this.value; updateCardTitle(${i},this.value)" />

        <div class="time-presets">
          ${[10,15,20,30,45,60,90,120].map(t =>
            `<button class="preset-btn ${(q.time||30)==t?'active':''}"
              onclick="setTime(${i},${t},this)">${t}s</button>`).join('')}
        </div>

        <div class="options-grid">
          ${q.options.map((opt,j) => `
            <div class="option-row">
              <div class="option-color" style="background:${OPTION_COLORS[j]}"></div>
              <input class="option-input" value="${escHtml(opt)}"
                oninput="questions[${i}].options[${j}]=this.value"
                placeholder="Option ${j+1}" />
              <input type="radio" class="option-correct" name="correct_${i}"
                ${q.correctAnswer===j?'checked':''}
                onchange="questions[${i}].correctAnswer=${j}" title="Richtige Antwort" />
            </div>`).join('')}
        </div>

        <!-- IMAGE SECTION -->
        <div class="image-section">
          <div class="image-section-title">🖼 Bild</div>

          <div class="image-upload-area" onclick="document.getElementById('imgInput_${i}').click()">
            <input type="file" id="imgInput_${i}" accept="image/*" style="display:none"
              onchange="uploadImage(event,${i})" />
            ${q.image
              ? `<img src="${q.image}" class="image-preview" />`
              : `<div>🖼 Bild hochladen (optional)</div>
                 <div style="color:#aaa;font-size:13px;margin-top:4px">Klicken · max. 5MB</div>`}
          </div>

          ${q.image ? `
            <button class="btn-remove-image" onclick="removeImage(${i})">🗑 Bild entfernen</button>
          ` : ''}

          <!-- Image Controls (only shown if image exists) -->
          <div id="imgControls_${i}" style="${q.image ? '' : 'display:none'}">
            <div class="img-controls">
              <div class="img-control-group">
                <label>📐 Position</label>
                <div class="chip-group">
                  ${posOptions.map(o => `
                    <div class="chip ${imgPos===o.v?'active':''}"
                      data-q="${i}" data-prop="imagePosition" data-val="${o.v}"
                      onclick="setImageProp(${i},'imagePosition','${o.v}')">${o.l}</div>
                  `).join('')}
                </div>
              </div>
              <div class="img-control-group">
                <label>📏 Grösse</label>
                <div class="chip-group">
                  ${sizeOptions.map(o => `
                    <div class="chip ${imgSize===o.v?'active':''}"
                      data-q="${i}" data-prop="imageSize" data-val="${o.v}"
                      onclick="setImageProp(${i},'imageSize','${o.v}')">${o.l}</div>
                  `).join('')}
                </div>
              </div>
              <div class="img-control-group">
                <label>✂️ Zuschnitt</label>
                <div class="chip-group">
                  ${fitOptions.map(o => `
                    <div class="chip ${imgFit===o.v?'active':''}"
                      data-q="${i}" data-prop="imageFit" data-val="${o.v}"
                      onclick="setImageProp(${i},'imageFit','${o.v}')">${o.l}</div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row-actions">
          <button class="btn-delete" onclick="deleteQuestion(${i})">🗑 Löschen</button>
        </div>
      </div>`;
    return card;
  }

  function removeImage(i) {
    questions[i].image = null;
    questions[i].imagePosition = 'right';
    questions[i].imageSize = 'medium';
    questions[i].imageFit = 'cover';
    renderQuestions();
    // Re-open the card
    const cards = document.querySelectorAll('.question-card');
    cards[i].classList.add('open');
  }

  function toggleCard(i) {
    document.querySelectorAll('.question-card')[i].classList.toggle('open');
  }
  function updateCardTitle(i, val) {
    document.querySelectorAll('.question-card')[i].querySelector('.q-title').textContent = val || 'Neue Frage';
  }
  function setTime(i, t, btn) {
    questions[i].time = t;
    btn.closest('.time-presets').querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addQuestion() {
    questions.push({
      question: '', options: ['','','',''], correctAnswer: 0, time: 30,
      image: null, imagePosition: 'right', imageSize: 'medium', imageFit: 'cover'
    });
    renderQuestions();
    const cards = document.querySelectorAll('.question-card');
    cards[cards.length-1].classList.add('open');
    cards[cards.length-1].scrollIntoView({ behavior: 'smooth' });
  }

  function deleteQuestion(i) {
    questions.splice(i, 1);
    renderQuestions();
  }

  async function uploadImage(event, i) {
    const file = event.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('image', file);
    const res  = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.url) {
      questions[i].image         = data.url;
      questions[i].imagePosition = questions[i].imagePosition || 'right';
      questions[i].imageSize     = questions[i].imageSize     || 'medium';
      questions[i].imageFit      = questions[i].imageFit      || 'cover';
      renderQuestions();
      // Re-open the card
      const cards = document.querySelectorAll('.question-card');
      cards[i].classList.add('open');
      showToast('✅ Bild hochgeladen');
    }
  }

  async function saveQuestions() {
    const res = await fetch(`/api/rooms/${roomCode}/questions`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword, questions })
    });
    if (res.ok) showToast('✅ Fragen gespeichert');
    else showToast('❌ Fehler beim Speichern');
  }

  // ── Socket Events ──
  socket.on('playerJoined', ({ playerCount }) => {
    document.getElementById('statPlayers').textContent = playerCount;
    document.getElementById('displayMeta').textContent = `${playerCount} Spieler · ${questions.length} Fragen`;
  });
  socket.on('playerLeft', ({ playerCount }) => {
    document.getElementById('statPlayers').textContent = playerCount;
  });
  socket.on('gameStarted', () => {
    updateButtons('playing');
    showToast('▶ Spiel gestartet!');
  });
  socket.on('newQuestion', ({ index, total }) => {
    document.getElementById('statCurrent').textContent = `${index+1}/${total}`;
    updateButtons('playing');
  });
  socket.on('questionEnd', ({ stats }) => {
    showLeaderboard(stats);
  });
  socket.on('gameFinished', ({ players }) => {
    updateButtons('finished');
    showLeaderboard(players);
    showToast('🏆 Spiel beendet!');
  });
  socket.on('gameReset', () => {
    updateButtons('waiting');
    document.getElementById('statCurrent').textContent = '-';
    document.getElementById('leaderboardSection').style.display = 'none';
    showToast('🔄 Spiel zurückgesetzt');
  });
  socket.on('quizNameUpdated', ({ quizName }) => {
    document.getElementById('quizNameInput').value = quizName;
    currentQuizName = quizName;
    saveRoomToStorage(roomCode, quizName);
  });

  function showLeaderboard(players) {
    const section = document.getElementById('leaderboardSection');
    const list    = document.getElementById('leaderboardList');
    section.style.display = 'block';
    const medals = ['🥇','🥈','🥉'];
    list.innerHTML = players.slice(0,10).map((p,i) => `
      <div class="leaderboard-item">
        <div class="lb-rank">${medals[i]||i+1}</div>
        <div class="lb-name">${escHtml(p.name)}</div>
        <div class="lb-score">${p.score} Pts</div>
      </div>`).join('');
    section.scrollIntoView({ behavior: 'smooth' });
  }

  // ── Init ──
  renderSavedRooms();
</script>
</body>
</html>
