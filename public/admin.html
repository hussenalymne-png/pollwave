<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollWave Admin</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:16px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2a2a4a}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:12px;color:#888}
.container{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:700;color:#667eea;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:10px 20px;border-radius:8px;border:1px solid #2a2a4a;background:transparent;color:#888;cursor:pointer;font-size:14px;transition:all .2s}
.tab.active{background:#667eea;color:#fff;border-color:#667eea}
.tab-content{display:none}
.tab-content.active{display:block}
input,select,textarea{width:100%;padding:10px 14px;background:#0f0f1a;border:1px solid #2a2a4a;border-radius:8px;color:#e0e0e0;font-size:14px;margin-bottom:12px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#667eea}
textarea{resize:vertical;min-height:80px}
label{font-size:13px;color:#aaa;display:block;margin-bottom:4px}
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-danger{background:#e74c3c;color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-success{background:#27ae60;color:#fff}
.btn-success:hover{background:#219a52}
.btn-secondary{background:#2a2a4a;color:#e0e0e0}
.btn-secondary:hover{background:#3a3a5a}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#0f0f1a;border-radius:8px;padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:800;color:#667eea}
.stat-label{font-size:11px;color:#888;margin-top:4px}
.player-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.player-item{background:#0f0f1a;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-green{background:#1a4a2e;color:#2ecc71}
.badge-yellow{background:#4a3a0a;color:#f1c40f}
.badge-gray{background:#2a2a3a;color:#888}
.question-list{display:flex;flex-direction:column;gap:10px}
.question-card{background:#0f0f1a;border-radius:8px;padding:14px;border:1px solid #2a2a4a;position:relative}
.question-card .q-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.question-card .q-text{font-size:14px;font-weight:600;flex:1}
.question-card .q-meta{font-size:12px;color:#888;margin-top:4px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.option-input-row{display:flex;gap:6px;align-items:center}
.option-input-row input{margin-bottom:0;flex:1}
.correct-radio{width:18px;height:18px;cursor:pointer;flex-shrink:0}
.correct-label{font-size:12px;color:#2ecc71;white-space:nowrap}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:14px}
.alert-error{background:#3a1a1a;border:1px solid #e74c3c;color:#e74c3c}
.alert-success{background:#1a3a2a;border:1px solid #2ecc71;color:#2ecc71}
.alert-info{background:#1a2a3a;border:1px solid #667eea;color:#667eea}
.code-display{font-size:48px;font-weight:900;letter-spacing:8px;color:#667eea;text-align:center;padding:20px;background:#0f0f1a;border-radius:12px;margin:12px 0;font-family:monospace}
.qr-box{text-align:center;padding:20px}
.qr-box canvas{border-radius:8px}
.saved-rooms{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto}
.saved-room-item{background:#0f0f1a;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer;border:1px solid transparent;transition:border-color .2s}
.saved-room-item:hover{border-color:#667eea}
.progress-bar{background:#0f0f1a;border-radius:8px;height:8px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);transition:width .3s}
.separator{border:none;border-top:1px solid #2a2a4a;margin:16px 0}
.image-preview{max-width:200px;max-height:120px;border-radius:8px;margin-top:8px;object-fit:cover}
#toast{position:fixed;bottom:24px;right:24px;background:#667eea;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;transform:translateY(80px);transition:transform .3s;z-index:1000}
#toast.show{transform:translateY(0)}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">⚡ PollWave</div>
    <div class="subtitle">Admin Dashboard</div>
  </div>
</div>

<div class="container">

  <!-- LOGIN / CREATE -->
  <div id="loginSection">
    <div class="card">
      <h2>Zugang</h2>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('create')">Neues Quiz</button>
        <button class="tab" onclick="switchTab('join')">Existierendes Quiz</button>
        <button class="tab" onclick="switchTab('saved')">Gespeichert</button>
      </div>

      <div id="tab-create" class="tab-content active">
        <label>Quiz-Name</label>
        <input type="text" id="newQuizName" placeholder="Mein Quiz" value="PollWave Quiz">
        <label>Admin-Passwort</label>
        <input type="password" id="newAdminPw" placeholder="Passwort">
        <label>Standard-Zeit pro Frage (Sekunden)</label>
        <input type="number" id="newTime" value="30" min="5" max="120">
        <button class="btn btn-primary" onclick="createRoom()">Quiz erstellen</button>
      </div>

      <div id="tab-join" class="tab-content">
        <label>Room-Code</label>
        <input type="text" id="joinCode" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-size:20px">
        <label>Admin-Passwort</label>
        <input type="password" id="joinPw" placeholder="Passwort">
        <button class="btn btn-primary" onclick="joinRoom()">Verbinden</button>
      </div>

      <div id="tab-saved" class="tab-content">
        <div id="savedRoomsList" class="saved-rooms"></div>
        <p id="noSaved" style="color:#888;font-size:14px;display:none">Keine gespeicherten Quizze.</p>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none">

    <!-- Stats -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
        <div>
          <h2 id="dashQuizName">Quiz</h2>
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
            <span style="font-size:13px;color:#888">Code:</span>
            <span id="dashCode" style="font-size:18px;font-weight:700;color:#667eea;letter-spacing:3px;font-family:monospace"></span>
            <button class="btn btn-secondary btn-sm" onclick="copyCode()">Kopieren</button>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-success" id="btnStart" onclick="startGame()">▶ Starten</button>
          <button class="btn btn-secondary" id="btnNext" onclick="nextQuestion()" style="display:none">⏭ Weiter</button>
          <button class="btn btn-danger" id="btnEnd" onclick="endGame()" style="display:none">⏹ Beenden</button>
          <button class="btn btn-secondary" id="btnReset" onclick="resetGame()" style="display:none">↺ Reset</button>
          <button class="btn btn-secondary btn-sm" onclick="logout()">Abmelden</button>
        </div>
      </div>

      <hr class="separator">

      <div class="stat-grid">
        <div class="stat"><div class="stat-value" id="statPlayers">0</div><div class="stat-label">Spieler</div></div>
        <div class="stat"><div class="stat-value" id="statQuestion">-</div><div class="stat-label">Frage</div></div>
        <div class="stat"><div class="stat-value" id="statAnswered">0</div><div class="stat-label">Geantwortet</div></div>
        <div class="stat"><div class="stat-value" id="statStatus">Warten</div><div class="stat-label">Status</div></div>
      </div>

      <div id="alertBox"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchDashTab('players')">Spieler</button>
      <button class="tab" onclick="switchDashTab('questions')">Fragen</button>
      <button class="tab" onclick="switchDashTab('share')">Teilen</button>
    </div>

    <div id="dtab-players" class="tab-content active">
      <div class="card">
        <h2>Spieler</h2>
        <div id="playerList" class="player-list">
          <p style="color:#888;font-size:14px">Noch keine Spieler.</p>
        </div>
      </div>
    </div>

    <div id="dtab-questions" class="tab-content">
      <div class="card">
        <h2>Fragen verwalten</h2>
        <div class="btn-row" style="margin-bottom:16px">
          <button class="btn btn-primary btn-sm" onclick="addQuestion()">+ Frage hinzufügen</button>
          <button class="btn btn-success btn-sm" onclick="saveQuestions()">💾 Speichern</button>
        </div>
        <div id="questionList" class="question-list"></div>
      </div>
    </div>

    <div id="dtab-share" class="tab-content">
      <div class="card">
        <h2>Teilen</h2>
        <div class="code-display" id="shareCode"></div>
        <div class="qr-box"><canvas id="qrCanvas"></canvas></div>
        <div class="btn-row" style="justify-content:center">
          <button class="btn btn-secondary btn-sm" onclick="openPresenter()">📺 Presenter öffnen</button>
          <button class="btn btn-secondary btn-sm" onclick="copyPlayerLink()">🔗 Spieler-Link kopieren</button>
        </div>
        <hr class="separator">
        <label>Quiz-Name ändern</label>
        <div style="display:flex;gap:8px">
          <input type="text" id="renameInput" placeholder="Neuer Name" style="margin-bottom:0">
          <button class="btn btn-primary btn-sm" onclick="renameQuiz()">✓</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script>
const socket = io();
let currentCode = null;
let currentPw   = null;
let gameState   = { status:'waiting', players:[], currentQuestion:-1, questions:[] };
let localQuestions = [];
let answered = 0;
let timerInterval = null;

// ─── Tabs ───────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('#loginSection .tab').forEach((t,i) => {
    t.classList.toggle('active', ['create','join','saved'][i] === name);
  });
  document.querySelectorAll('#loginSection .tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='saved') loadSavedRooms();
}

function switchDashTab(name) {
  document.querySelectorAll('.tabs')[1].querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['players','questions','share'][i] === name);
  });
  ['players','questions','share'].forEach(n => {
    document.getElementById('dtab-'+n).classList.toggle('active', n===name);
  });
}

// ─── Toast ───────────────────────────────────────────────
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#e74c3c' : '#667eea';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showAlert(msg, type) {
  const box = document.getElementById('alertBox');
  if (!msg) { box.innerHTML=''; return; }
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

// ─── Saved Rooms ─────────────────────────────────────────
function getSaved() { try { return JSON.parse(localStorage.getItem('pw_rooms')||'[]'); } catch(e){return[];} }
function saveSaved(arr) { localStorage.setItem('pw_rooms', JSON.stringify(arr.slice(0,10))); }
function addSaved(code, name, pw) {
  const arr = getSaved().filter(r => r.code !== code);
  arr.unshift({ code, name, pw });
  saveSaved(arr);
}
function loadSavedRooms() {
  const arr = getSaved();
  const list = document.getElementById('savedRoomsList');
  const none = document.getElementById('noSaved');
  if (!arr.length) { list.innerHTML=''; none.style.display='block'; return; }
  none.style.display='none';
  list.innerHTML = arr.map(r => `
    <div class="saved-room-item" onclick="loadSaved('${r.code}','${r.pw}')">
      <div>
        <div style="font-weight:600">${r.name||r.code}</div>
        <div style="color:#888;font-size:12px">${r.code}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteSaved('${r.code}')">✕</button>
    </div>`).join('');
}
function loadSaved(code, pw) {
  document.getElementById('joinCode').value = code;
  document.getElementById('joinPw').value   = pw;
  switchTab('join');
  joinRoom();
}
function deleteSaved(code) {
  saveSaved(getSaved().filter(r => r.code !== code));
  loadSavedRooms();
}

// ─── Create / Join ───────────────────────────────────────
async function createRoom() {
  const name = document.getElementById('newQuizName').value.trim() || 'PollWave Quiz';
  const pw   = document.getElementById('newAdminPw').value.trim();
  const time = parseInt(document.getElementById('newTime').value) || 30;
  if (!pw) { showToast('Passwort eingeben!', true); return; }
  try {
    const r = await fetch('/api/rooms', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ quizName:name, adminPassword:pw, timePerQuestion:time })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    addSaved(d.code, name, pw);
    connectToRoom(d.code, pw);
  } catch(e) { showToast(e.message, true); }
}

async function joinRoom() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  const pw   = document.getElementById('joinPw').value.trim();
  if (!code||!pw) { showToast('Code und Passwort eingeben!', true); return; }
  try {
    const r = await fetch(`/api/rooms/${code}/rejoin`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ adminPassword:pw })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    addSaved(code, d.quizName, pw);
    connectToRoom(code, pw);
  } catch(e) { showToast(e.message, true); }
}

function connectToRoom(code, pw) {
  currentCode = code;
  currentPw   = pw;
  socket.emit('joinGame', { code, name:'__admin__' });
}

// ─── Socket events ───────────────────────────────────────
socket.on('roomJoined', d => {
  gameState.status          = d.status;
  gameState.currentQuestion = d.currentQuestion;
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('dashboard').style.display    = 'block';
  document.getElementById('dashCode').textContent    = d.code;
  document.getElementById('dashQuizName').textContent= d.quizName;
  document.getElementById('shareCode').textContent   = d.code;
  document.getElementById('statPlayers').textContent = d.playerCount || 0;
  updateStatusDisplay(d.status, d.currentQuestion);
  loadQuestionsFromServer(d.code);
  generateQR(d.code);
});

socket.on('playerUpdate', d => {
  document.getElementById('statPlayers').textContent = d.count;
  refreshPlayerList();
});

socket.on('gameStarted', () => {
  gameState.status = 'playing';
  answered = 0;
  updateStatusDisplay('playing', 0);
  showAlert('Spiel gestartet!', 'success');
});

socket.on('newQuestion', d => {
  gameState.currentQuestion = d.index;
  answered = 0;
  document.getElementById('statQuestion').textContent = `${d.index+1}/${d.total}`;
  document.getElementById('statAnswered').textContent = '0';
  showAlert(`Frage ${d.index+1}: ${d.question}`, 'info');
  updateButtons('playing');
});

socket.on('timerUpdate', d => {
  document.getElementById('statStatus').textContent = `⏱ ${d.timeLeft}s`;
});

socket.on('answerSubmitted', d => {
  answered = d.answered || answered+1;
  document.getElementById('statAnswered').textContent = answered;
});

socket.on('questionEnd', d => {
  showAlert(`Frage beendet. Richtige Antwort: Option ${d.correctAnswer+1}`, 'info');
  updateButtons('between');
});

socket.on('gameEnd', d => {
  gameState.status = 'finished';
  updateStatusDisplay('finished', gameState.currentQuestion);
  showAlert('Spiel beendet! 🎉', 'success');
});

socket.on('gameReset', () => {
  gameState.status = 'waiting';
  gameState.currentQuestion = -1;
  answered = 0;
  updateStatusDisplay('waiting', -1);
  showAlert('Spiel zurückgesetzt.', 'info');
});

socket.on('error', d => showToast(d.message, true));

// ─── Status & Buttons ────────────────────────────────────
function updateStatusDisplay(status, qi) {
  const labels = { waiting:'Warten', playing:'Läuft', finished:'Beendet', between:'Zwischen' };
  document.getElementById('statStatus').textContent = labels[status] || status;
  if (qi >= 0 && gameState.questions.length)
    document.getElementById('statQuestion').textContent = `${qi+1}/${gameState.questions.length}`;
  else document.getElementById('statQuestion').textContent = '-';
  updateButtons(status);
}

function updateButtons(status) {
  const btnStart = document.getElementById('btnStart');
  const btnNext  = document.getElementById('btnNext');
  const btnEnd   = document.getElementById('btnEnd');
  const btnReset = document.getElementById('btnReset');
  btnStart.style.display = status==='waiting' ? '' : 'none';
  btnNext.style.display  = status==='between' ? '' : 'none';
  btnEnd.style.display   = status==='playing'||status==='between' ? '' : 'none';
  btnReset.style.display = status==='finished'||status==='playing' ? '' : 'none';
}

// ─── Game Controls ───────────────────────────────────────
function startGame()    { socket.emit('startGame',    { code:currentCode, adminPassword:currentPw }); }
function nextQuestion() { socket.emit('nextQuestion', { code:currentCode, adminPassword:currentPw }); }
function endGame()      {
  if (!confirm('Spiel wirklich beenden?')) return;
  socket.emit('endGame', { code:currentCode, adminPassword:currentPw });
}
function resetGame()    {
  if (!confirm('Spiel wirklich zurücksetzen?')) return;
  socket.emit('resetGame', { code:currentCode, adminPassword:currentPw });
}

// ─── Players ─────────────────────────────────────────────
async function refreshPlayerList() {
  try {
    const r = await fetch(`/api/rooms/${currentCode}`);
    const d = await r.json();
    const qi = gameState.currentQuestion;
    const answers = {};
    const list = document.getElementById('playerList');
    if (!d.players || !d.players.length) {
      list.innerHTML='<p style="color:#888;font-size:14px">Noch keine Spieler.</p>';
      return;
    }
    list.innerHTML = (d.players||[]).filter(p=>p.name!=='__presenter__'&&p.name!=='__admin__').map(p => `
      <div class="player-item">
        <span>${p.name}</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-weight:700;color:#667eea">${p.score||0} Pts</span>
          <span class="badge ${p.active?'badge-green':'badge-gray'}">${p.active?'Online':'Offline'}</span>
        </div>
      </div>`).join('');
  } catch(e){}
}

// ─── Questions ───────────────────────────────────────────
async function loadQuestionsFromServer(code) {
  try {
    const r = await fetch(`/api/rooms/${code}`);
    const d = await r.json();
    gameState.questions = d.questions || [];
    localQuestions = JSON.parse(JSON.stringify(gameState.questions));
    renderQuestions();
  } catch(e){}
}

function renderQuestions() {
  const list = document.getElementById('questionList');
  if (!localQuestions.length) {
    list.innerHTML='<p style="color:#888;font-size:14px">Keine Fragen. Füge welche hinzu!</p>';
    return;
  }
  list.innerHTML = localQuestions.map((q,i) => buildQuestionCard(q,i)).join('');
}

function buildQuestionCard(q, i) {
  const opts = ['A','B','C','D'];
  const optionsHtml = (q.options||['','','','']).map((o,j) => `
    <div class="option-input-row">
      <span style="color:#667eea;font-weight:700;min-width:20px">${opts[j]}</span>
      <input type="text" value="${escHtml(o)}" placeholder="Option ${opts[j]}"
        onchange="updateOption(${i},${j},this.value)">
      <input type="radio" class="correct-radio" name="correct_${i}" value="${j}"
        ${q.correctAnswer===j?'checked':''} onchange="updateCorrect(${i},${j})"
        title="Als richtig markieren">
      <span class="correct-label">${q.correctAnswer===j?'✓':''}</span>
    </div>`).join('');

  return `
    <div class="question-card">
      <div class="q-header">
        <div style="flex:1">
          <div style="font-size:12px;color:#667eea;margin-bottom:4px">Frage ${i+1}</div>
          <input type="text" value="${escHtml(q.question||'')}" placeholder="Fragetext"
            onchange="updateQuestion(${i},'question',this.value)"
            style="font-weight:700;margin-bottom:8px">
        </div>
        <button class="btn btn-danger btn-sm" onclick="removeQuestion(${i})">✕</button>
      </div>
      <div class="options-grid">${optionsHtml}</div>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:flex-end">
        <div style="flex:1;min-width:120px">
          <label>Zeit (s)</label>
          <input type="number" value="${q.time||30}" min="5" max="120"
            onchange="updateQuestion(${i},'time',parseInt(this.value))"
            style="margin-bottom:0">
        </div>
        <div style="flex:2;min-width:200px">
          <label>Bild-URL oder hochladen</label>
          <div style="display:flex;gap:6px">
            <input type="text" value="${q.image||''}" placeholder="/uploads/bild.jpg"
              onchange="updateQuestion(${i},'image',this.value)"
              style="margin-bottom:0;flex:1">
            <input type="file" accept="image/*" style="display:none" id="imgFile_${i}"
              onchange="uploadImage(${i})">
            <button class="btn btn-secondary btn-sm" onclick="document.getElementById('imgFile_${i}').click()">📷</button>
          </div>
          ${q.image?`<img src="${q.image}" class="image-preview" onerror="this.style.display='none'">`:''}
        </div>
        <div style="min-width:120px">
          <label>Bild-Position</label>
          <select onchange="updateQuestion(${i},'imagePosition',this.value)" style="margin-bottom:0">
            ${['top','bottom','left','right','background'].map(pos=>
              `<option value="${pos}" ${q.imagePosition===pos?'selected':''}>${pos}</option>`
            ).join('')}
          </select>
        </div>
      </div>
    </div>`;
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateQuestion(i, key, val) { localQuestions[i][key] = val; }
function updateOption(i, j, val)     { localQuestions[i].options[j] = val; }
function updateCorrect(i, j)         { localQuestions[i].correctAnswer = j; renderQuestions(); }

function addQuestion() {
  localQuestions.push({
    question:'', options:['','','',''],
    correctAnswer:0, time:30, image:'', imagePosition:'top'
  });
  renderQuestions();
  document.getElementById('questionList').lastElementChild?.scrollIntoView({ behavior:'smooth' });
}

function removeQuestion(i) {
  if (!confirm('Frage löschen?')) return;
  localQuestions.splice(i,1);
  renderQuestions();
}

async function uploadImage(i) {
  const file = document.getElementById(`imgFile_${i}`).files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append('image', file);
  try {
    const r = await fetch('/api/upload', { method:'POST', body:fd });
    const d = await r.json();
    if (d.url) { localQuestions[i].image = d.url; renderQuestions(); showToast('Bild hochgeladen!'); }
  } catch(e) { showToast('Upload fehlgeschlagen', true); }
}

async function saveQuestions() {
  try {
    const r = await fetch(`/api/rooms/${currentCode}/questions`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ adminPassword:currentPw, questions:localQuestions })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    gameState.questions = JSON.parse(JSON.stringify(localQuestions));
    showToast('Gespeichert!');
  } catch(e) { showToast(e.message, true); }
}

// ─── Share ───────────────────────────────────────────────
function generateQR(code) {
  const url  = `${location.origin}?code=${code}`;
  const size = 200;
  const canvas = document.getElementById('qrCanvas');
  canvas.width  = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#667eea';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(url, size/2, size/2-10);
  ctx.fillText('QR Generator', size/2, size/2+10);
  ctx.fillText('(install qrcode lib)', size/2, size/2+28);
}

function copyCode() {
  navigator.clipboard.writeText(currentCode).then(()=>showToast('Code kopiert!'));
}

function copyPlayerLink() {
  const url = `${location.origin}?code=${currentCode}`;
  navigator.clipboard.writeText(url).then(()=>showToast('Link kopiert!'));
}

function openPresenter() {
  window.open(`/present.html?code=${currentCode}&pw=${currentPw}`, '_blank');
}

async function renameQuiz() {
  const name = document.getElementById('renameInput').value.trim();
  if (!name) return;
  try {
    const r = await fetch(`/api/rooms/${currentCode}/name`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ adminPassword:currentPw, quizName:name })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    document.getElementById('dashQuizName').textContent = name;
    showToast('Name gespeichert!');
  } catch(e) { showToast(e.message, true); }
}

// ─── Misc ────────────────────────────────────────────────
function logout() {
  currentCode = null;
  currentPw   = null;
  document.getElementById('dashboard').style.display    = 'none';
  document.getElementById('loginSection').style.display = 'block';
}
</script>
</body>
</html>
