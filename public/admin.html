<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollWave – Admin</title>
<script src="/socket.io/socket.io.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0a0a1a; color:white; min-height:100vh; padding:20px; }
.container { max-width:1000px; margin:0 auto; }
h1 { font-size:2.5rem; margin-bottom:20px; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
h2 { margin:20px 0 10px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:30px; }
.card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:20px; }
label { display:block; margin:10px 0 5px; opacity:0.7; }
input, textarea, select { width:100%; padding:12px; margin-bottom:10px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:8px; color:white; font-size:1rem; }
textarea { resize:vertical; min-height:80px; }
button { padding:12px 24px; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-size:1rem; transition:0.2s; }
button.primary { background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
button.primary:hover { transform:scale(1.03); }
button.danger { background:#ff5757; color:white; }
button.secondary { background:rgba(255,255,255,0.1); color:white; }
.options-row { display:flex; gap:10px; align-items:center; }
.options-row input { flex:1; }
.question-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:15px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.question-item span { flex:1; }
.room-code-display { font-size:2rem; letter-spacing:6px; color:#667eea; margin:10px 0; }
.toolbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
#livePreview { border:1px solid #667eea; border-radius:12px; padding:20px; text-align:center; margin-top:20px; }
#livePreview img { max-width:100%; max-height:150px; object-fit:contain; border-radius:8px; margin-bottom:10px; }
#livePreview .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#livePreview .option { padding:15px; border-radius:10px; background:rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="container">
<h1>🧑‍💼 PollWave Admin</h1>

<div id="loginSection">
  <div class="card">
    <h2>Raum erstellen / betreten</h2>
    <label>Room-Code (leer lassen für neuen Raum)</label>
    <input type="text" id="roomCodeInput" placeholder="z.B. AB12CD" maxlength="6" style="text-transform:uppercase;">
    <button class="primary" onclick="adminLogin()">🚪 Raum öffnen</button>
    <div id="adminRoomCode" class="room-code-display"></div>
  </div>
</div>

<div id="dashboard" style="display:none;">
  <div class="toolbar">
    <button class="primary" onclick="startGame()" id="startBtn">▶️ Spiel starten</button>
    <button class="secondary" onclick="nextQuestion()" id="nextBtn">⏭️ Nächste Frage</button>
    <span style="flex:1;"></span>
    <button class="danger" onclick="resetGame()">🔄 Zurücksetzen</button>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Fragen verwalten</h2>
        <div id="questionsList"></div>
      </div>
      <div class="card" style="margin-top:20px;">
        <h2>Neue Frage</h2>
        <label>Frage</label>
        <textarea id="questionText" placeholder="Deine Frage..."></textarea>
        <div id="optionsContainer">
          <div class="options-row"><input class="opt" placeholder="Option A"><input class="opt" placeholder="Option B"></div>
          <div class="options-row"><input class="opt" placeholder="Option C"><input class="opt" placeholder="Option D"></div>
        </div>
        <label>Richtige Antwort (0-3)</label>
        <input type="number" id="correctIndex" min="0" max="3" value="0">
        <label>Bild-URL (optional)</label>
        <input type="text" id="imageUrl" placeholder="https://...">
        <button class="primary" onclick="addQuestion()">➕ Frage hinzufügen</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Live-Vorschau</h2>
        <div id="livePreview">
          <p style="opacity:0.5;">Warte auf Spielstart...</p>
        </div>
      </div>
      <div class="card" style="margin-top:20px;">
        <h2>Spieler</h2>
        <div id="participantsCount">👥 0 Teilnehmer</div>
        <div id="participantsList"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
const socket = io();
let roomCode = '';
let questions = [];

function adminLogin() {
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  socket.emit('adminLogin', { code }, (res) => {
    if (res.success) {
      roomCode = res.code;
      document.getElementById('adminRoomCode').textContent = roomCode;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      questions = res.questions || [];
      renderQuestions();
      updateParticipantsDisplay(res.state);
      if (res.state === 'playing') {
        document.getElementById('startBtn').disabled = true;
      }
    } else {
      alert(res.error || 'Fehler');
    }
  });
}

function addQuestion() {
  const question = document.getElementById('questionText').value.trim();
  const optInputs = document.querySelectorAll('.opt');
  const options = [];
  optInputs.forEach(inp => {
    const val = inp.value.trim();
    if (val) options.push(val);
  });
  const correct = parseInt(document.getElementById('correctIndex').value);
  const image = document.getElementById('imageUrl').value.trim() || null;
  if (!question || options.length < 2) { alert('Bitte Frage und mindestens 2 Optionen angeben!'); return; }
  socket.emit('addQuestion', { question, options, correct, image }, (res) => {
    if (res.success) {
      questions = res.questions;
      renderQuestions();
      document.getElementById('questionText').value = '';
      document.querySelectorAll('.opt').forEach(inp => inp.value = '');
    }
  });
}

function deleteQuestion(index) {
  socket.emit('deleteQuestion', index, (res) => {
    if (res.success) {
      questions = res.questions;
      renderQuestions();
    }
  });
}

function renderQuestions() {
  const container = document.getElementById('questionsList');
  if (questions.length === 0) {
    container.innerHTML = '<p style="opacity:0.5;">Noch keine Fragen vorhanden.</p>';
    return;
  }
  container.innerHTML = questions.map((q, i) => `
    <div class="question-item">
      <span><strong>${i+1}.</strong> ${q.question.substring(0,50)}${q.question.length > 50 ? '...' : ''}</span>
      <button class="danger" onclick="deleteQuestion(${i})" style="padding:8px 12px;">🗑️</button>
    </div>
  `).join('');
}

function startGame() {
  socket.emit('startGame', (res) => {
    if (res.success) {
      document.getElementById('startBtn').disabled = true;
    } else {
      alert(res.error || 'Fehler');
    }
  });
}

function nextQuestion() {
  socket.emit('nextQuestion', (res) => {
    if (!res.success) alert(res.error || 'Fehler');
  });
}

function resetGame() {
  if (confirm('Wirklich zurücksetzen?')) {
    socket.emit('adminLogout');
    location.reload();
  }
}

// Socket-Events für Admin
socket.on('questionsUpdated', (qs) => {
  questions = qs;
  renderQuestions();
});

socket.on('questionStarted', (data) => {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
  const preview = document.getElementById('livePreview');
  preview.innerHTML = `
    <h3>Frage ${data.index + 1}/${data.total}</h3>
    <p><strong>${data.question}</strong></p>
    ${data.image ? `<img src="${data.image}" alt="">` : ''}
    <div class="options">
      ${data.options.map((o,i) => `<div class="option">${String.fromCharCode(65+i)}: ${o}</div>`).join('')}
    </div>
    <p>⏱️ ${data.time}s</p>
  `;
});

socket.on('timerUpdate', (data) => {
  const preview = document.getElementById('livePreview');
  const timerEl = preview.querySelector('p:last-child');
  if (timerEl) timerEl.textContent = '⏱️ ' + data.time + 's';
});

socket.on('questionEnded', (data) => {
  const preview = document.getElementById('livePreview');
  preview.innerHTML = `<p>Frage beendet – richtige Antwort: ${String.fromCharCode(65+data.correct)}</p>`;
  document.getElementById('nextBtn').disabled = false;
});

socket.on('participantJoined', (data) => {
  document.getElementById('participantsCount').textContent = `👥 ${data.count} Teilnehmer`;
});

socket.on('leaderboardUpdate', (data) => {
  // optional – für Admin nicht nötig, aber können wir später nutzen
});

socket.on('gameFinished', (data) => {
  alert('Spiel beendet!');
  document.getElementById('startBtn').disabled = false;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('livePreview').innerHTML = '<p>Spiel beendet – Sieger: ' + (data[0]?.name || '?') + '</p>';
});

function updateParticipantsDisplay(state) {
  // Einfache Dummy-Anzeige – wird durch Events aktualisiert
}
</script>
</body>
</html>
