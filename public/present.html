<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollWave Presenter</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0}

/* Layout */
#app{width:100%;height:100vh;display:flex;flex-direction:column;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(15,15,26,.95);border-bottom:1px solid #2a2a4a;z-index:10;flex-shrink:0}
.logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.quiz-name{font-size:14px;color:#888;margin-top:2px}
.top-right{display:flex;align-items:center;gap:16px}
.player-badge{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:20px;padding:6px 14px;font-size:13px;color:#aaa}
.player-badge span{color:#667eea;font-weight:700}
#btnNext{padding:8px 20px;border-radius:8px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:none}
#btnNext:hover{opacity:.9}

.main{flex:1;display:flex;overflow:hidden;position:relative}

/* Screens */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.screen.active{display:flex}

/* Waiting */
#s-waiting{gap:20px}
.wait-code{font-size:100px;font-weight:900;letter-spacing:12px;color:#667eea;font-family:monospace;text-align:center;line-height:1}
.wait-sub{font-size:20px;color:#888}
.wait-url{font-size:16px;color:#aaa;background:#1a1a2e;padding:10px 24px;border-radius:8px;font-family:monospace}
.wait-players{font-size:64px;font-weight:900;color:#764ba2;text-align:center}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;background:#667eea;margin:3px;animation:dot .8s infinite alternate}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}

/* Question */
#s-question{padding:0}
.q-layout{width:100%;height:100%;display:grid;position:relative}
.q-layout.img-top{grid-template-rows:40% 60%}
.q-layout.img-bottom{grid-template-rows:60% 40%}
.q-layout.img-left{grid-template-columns:40% 60%;grid-template-rows:1fr}
.q-layout.img-right{grid-template-columns:60% 40%;grid-template-rows:1fr}
.q-layout.img-none{grid-template-rows:1fr}

.q-img-panel{overflow:hidden;position:relative}
.q-img-panel img{width:100%;height:100%;object-fit:cover}
.q-bg-overlay{position:absolute;inset:0;background:rgba(15,15,26,.55)}

.q-content{display:flex;flex-direction:column;padding:24px 40px;overflow:hidden}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-shrink:0}
.q-progress{font-size:14px;color:#888;font-weight:600}
.q-timer-wrap{position:relative;width:64px;height:64px;flex-shrink:0}
.q-timer-wrap svg{transform:rotate(-90deg)}
.q-timer-wrap circle{fill:none;stroke:#2a2a4a;stroke-width:5}
.q-timer-wrap circle.prog{stroke:#667eea;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .5s}
.q-timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900}

.q-text{font-size:clamp(20px,3vw,36px);font-weight:800;line-height:1.35;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px}

.q-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex-shrink:0}
.q-opt{padding:16px 20px;border-radius:12px;font-size:clamp(14px,2vw,20px);font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.q-opt .lbl{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.q-opt-0{background:#e74c3c}
.q-opt-1{background:#3498db}
.q-opt-2{background:#2ecc71}
.q-opt-3{background:#f39c12}

/* Background image mode */
.q-bg-mode{position:absolute;inset:0}
.q-bg-mode img{width:100%;height:100%;object-fit:cover}
.q-bg-mode .q-bg-overlay{position:absolute;inset:0;background:rgba(15,15,26,.7)}
.q-bg-mode-content{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px 40px}

/* Answer reveal */
.q-opt.revealed-correct{box-shadow:0 0 0 4px #2ecc71,0 0 24px rgba(46,204,113,.4);transform:scale(1.02)}
.q-opt.revealed-wrong{opacity:.4;filter:grayscale(.5)}

/* Answer bars */
.answer-bars{display:flex;flex-direction:column;gap:8px;margin-top:12px;flex-shrink:0}
.answer-bar-row{display:flex;align-items:center;gap:10px}
.answer-bar-label{font-size:13px;font-weight:700;color:#888;min-width:20px}
.answer-bar-bg{flex:1;background:#0f0f1a;border-radius:6px;height:14px;overflow:hidden}
.answer-bar-fill{height:100%;border-radius:6px;transition:width .5s ease;min-width:4px}
.answer-bar-count{font-size:12px;color:#aaa;min-width:28px;text-align:right}

/* Leaderboard */
#s-leaderboard{gap:24px}
.lb-title{font-size:32px;font-weight:900;text-align:center}
.lb-podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:180px}
.lb-p{display:flex;flex-direction:column;align-items:center;gap:8px}
.lb-p-name{font-size:16px;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.lb-p-score{font-size:13px;color:#888}
.lb-p-block{width:110px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff}
.lb-p-1{background:linear-gradient(135deg,#f1c40f,#e67e22);height:140px}
.lb-p-2{background:linear-gradient(135deg,#95a5a6,#7f8c8d);height:100px}
.lb-p-3{background:linear-gradient(135deg,#cd7f32,#a05c1e);height:70px}
.lb-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:600px;max-height:280px;overflow-y:auto}
.lb-row{background:#1a1a2e;border-radius:10px;padding:12px 20px;display:flex;align-items:center;gap:16px;font-size:15px}
.lb-row-rank{font-size:18px;font-weight:800;min-width:36px;color:#888}
.lb-row-name{flex:1;font-weight:600}
.lb-row-score{font-weight:700;color:#667eea}

canvas#confettiP{position:fixed;inset:0;pointer-events:none;z-index:999}
</style>
</head>
<body>
<canvas id="confettiP" style="display:none"></canvas>

<div id="app">
  <div class="top-bar">
    <div>
      <div class="logo">⚡ PollWave</div>
      <div class="quiz-name" id="topQuizName">Lade…</div>
    </div>
    <div class="top-right">
      <div class="player-badge">Spieler: <span id="topPlayers">0</span></div>
      <button id="btnNext" onclick="doNext()">⏭ Weiter</button>
    </div>
  </div>

  <div class="main">

    <!-- WAITING -->
    <div class="screen active" id="s-waiting">
      <div class="wait-code" id="wCode">––––––</div>
      <div class="wait-sub">Gib den Code auf pollwave-4kda.onrender.com ein</div>
      <div class="wait-url" id="wUrl"></div>
      <div class="wait-players"><span id="wPlayers">0</span> online</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <!-- QUESTION -->
    <div class="screen" id="s-question">
      <div class="q-layout img-none" id="qLayout">

        <!-- Image panel (top/bottom/left/right) -->
        <div class="q-img-panel" id="qImgPanel" style="display:none">
          <img id="qImg" src="" alt="">
        </div>

        <!-- Content -->
        <div class="q-content" id="qContent">
          <div class="q-meta">
            <span class="q-progress" id="qProgress">Frage 1/1</span>
            <div class="q-timer-wrap">
              <svg width="64" height="64" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="36"/>
                <circle class="prog" id="pTimerCircle" cx="32" cy="32" r="36"/>
              </svg>
              <div class="q-timer-text" id="pTimerText">30</div>
            </div>
          </div>
          <div class="q-text" id="qText"></div>
          <div class="q-options" id="qOpts"></div>
          <div class="answer-bars" id="answerBars" style="display:none"></div>
        </div>

      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="screen" id="s-leaderboard">
      <div class="lb-title">🏆 Ergebnisse</div>
      <div class="lb-podium" id="lbPodium"></div>
      <div class="lb-list" id="lbList"></div>
    </div>

  </div>
</div>

<script>
const socket = io();
const params = new URLSearchParams(location.search);
const CODE   = (params.get('code')||'').toUpperCase();
const PW     = params.get('pw')||'';
let quizName = 'PollWave';
let maxTime  = 30;
let currentCorrect = -1;
let answerCounts   = [];

// ─── Init ─────────────────────────────────────────────────
window.addEventListener('load', () => {
  document.getElementById('wCode').textContent = CODE || '––––––';
  document.getElementById('wUrl').textContent  = `${location.origin}?code=${CODE}`;
  if (PW) document.getElementById('btnNext').style.display = 'inline-block';
  if (CODE) socket.emit('joinGame', { code: CODE, name: '__presenter__' });
});

// ─── Socket ───────────────────────────────────────────────
socket.on('roomJoined', d => {
  quizName = d.quizName || 'PollWave';
  document.getElementById('topQuizName').textContent = quizName;
  document.getElementById('topPlayers').textContent  = d.playerCount || 0;
  document.getElementById('wCode').textContent       = d.code;
  document.getElementById('wUrl').textContent        = `${location.origin}?code=${d.code}`;
  if (d.status === 'playing' && d.currentQuestion >= 0) {
    // already in progress – stay on waiting until next event
  }
});

socket.on('playerUpdate', d => {
  document.getElementById('topPlayers').textContent = d.count;
  document.getElementById('wPlayers').textContent   = d.count;
});

socket.on('gameStarted', () => {
  show('waiting');
});

socket.on('newQuestion', d => {
  currentCorrect = d.correctAnswer;
  answerCounts   = new Array(d.options.length).fill(0);
  maxTime        = d.time || 30;

  document.getElementById('qProgress').textContent    = `Frage ${d.index+1}/${d.total}`;
  document.getElementById('pTimerText').textContent   = maxTime;
  document.getElementById('pTimerCircle').style.strokeDashoffset = 0;
  document.getElementById('pTimerCircle').style.stroke = '#667eea';
  document.getElementById('answerBars').style.display  = 'none';

  buildOptions(d.options, -1);
  buildLayout(d);
  show('question');
});

socket.on('timerUpdate', d => {
  const left = d.timeLeft;
  const max  = d.maxTime || maxTime;
  document.getElementById('pTimerText').textContent = left;
  const circ   = 2 * Math.PI * 36;
  const offset = circ - (left / max) * circ;
  document.getElementById('pTimerCircle').style.strokeDashoffset = offset;
  if (left <= 5)       document.getElementById('pTimerCircle').style.stroke = '#e74c3c';
  else if (left <= 10) document.getElementById('pTimerCircle').style.stroke = '#f39c12';
  else                 document.getElementById('pTimerCircle').style.stroke = '#667eea';
});

socket.on('answerSubmitted', d => {
  if (d.answerIndex !== undefined && d.answerIndex >= 0 && d.answerIndex < answerCounts.length) {
    answerCounts[d.answerIndex]++;
  }
  if (d.answerCounts) answerCounts = d.answerCounts;
  updateAnswerBars(false);
});

socket.on('questionEnd', d => {
  currentCorrect = d.correctAnswer;
  if (d.answerCounts) answerCounts = d.answerCounts;
  buildOptions(null, d.correctAnswer);
  updateAnswerBars(true);
});

socket.on('gameEnd', d => {
  showLeaderboard(d.leaderboard || []);
});

socket.on('gameReset', () => {
  show('waiting');
});

// ─── Layout builder ───────────────────────────────────────
function buildLayout(d) {
  const layout   = document.getElementById('qLayout');
  const imgPanel = document.getElementById('qImgPanel');
  const qContent = document.getElementById('qContent');
  const qImg     = document.getElementById('qImg');
  const qScreen  = document.getElementById('s-question');

  // Reset
  layout.className = 'q-layout';
  imgPanel.style.display = 'none';
  qScreen.style.backgroundImage = '';
  qScreen.style.backgroundSize  = '';
  qContent.style.background     = '';

  if (!d.image) {
    layout.classList.add('img-none');
    return;
  }

  const pos = d.imagePosition || 'top';

  if (pos === 'background') {
    layout.classList.add('img-none');
    qScreen.style.backgroundImage = `url('${d.image}')`;
    qScreen.style.backgroundSize  = 'cover';
    qScreen.style.backgroundPosition = 'center';
    qContent.style.background = 'rgba(15,15,26,.72)';
    qContent.style.borderRadius = '0';
    return;
  }

  imgPanel.style.display = 'block';
  qImg.src = d.image;

  if (pos === 'top') {
    layout.classList.add('img-top');
    layout.style.gridTemplateAreas = '"img" "content"';
    imgPanel.style.gridArea = 'img';
    qContent.style.gridArea = 'content';
  } else if (pos === 'bottom') {
    layout.classList.add('img-bottom');
    layout.style.gridTemplateAreas = '"content" "img"';
    imgPanel.style.gridArea = 'content';
    qContent.style.gridArea = 'img';
    // swap
    imgPanel.style.gridArea = 'img';
    qContent.style.gridArea = 'content';
    layout.style.gridTemplateAreas = '"content" "img"';
    qContent.style.gridArea = 'img';
    imgPanel.style.gridArea = 'content';
  } else if (pos === 'left') {
    layout.classList.add('img-left');
    layout.style.gridTemplateAreas = '"img content"';
    imgPanel.style.gridArea = 'img';
    qContent.style.gridArea = 'content';
  } else if (pos === 'right') {
    layout.classList.add('img-right');
    layout.style.gridTemplateAreas = '"content img"';
    qContent.style.gridArea = 'content';
    imgPanel.style.gridArea = 'img';
  }
}

// ─── Options ──────────────────────────────────────────────
const OPT_COLORS = ['q-opt-0','q-opt-1','q-opt-2','q-opt-3'];
const OPT_LABELS = ['A','B','C','D'];

function buildOptions(options, correctIdx) {
  const grid = document.getElementById('qOpts');
  if (options) {
    grid.innerHTML = options.map((o,i) => `
      <div class="q-opt ${OPT_COLORS[i]}" id="pOpt${i}">
        <div class="lbl">${OPT_LABELS[i]}</div>
        <span>${o}</span>
      </div>`).join('');
  } else {
    // just reveal
    document.querySelectorAll('.q-opt').forEach((el,i) => {
      if (i === correctIdx) el.classList.add('revealed-correct');
      else                  el.classList.add('revealed-wrong');
    });
  }
}

// ─── Answer bars ─────────────────────────────────────────
function updateAnswerBars(reveal) {
  const bars = document.getElementById('answerBars');
  bars.style.display = 'flex';
  const total = answerCounts.reduce((a,b) => a+b, 0) || 1;
  const barColors = ['#e74c3c','#3498db','#2ecc71','#f39c12'];
  bars.innerHTML = answerCounts.map((c,i) => {
    const pct = Math.round((c/total)*100);
    const highlight = reveal && i === currentCorrect ? '2px solid #2ecc71' : 'none';
    return `
      <div class="answer-bar-row">
        <div class="answer-bar-label">${OPT_LABELS[i]}</div>
        <div class="answer-bar-bg" style="border:${highlight}">
          <div class="answer-bar-fill"
            style="width:${pct}%;background:${barColors[i]}"></div>
        </div>
        <div class="answer-bar-count">${c}</div>
      </div>`;
  }).join('');
}

// ─── Leaderboard ─────────────────────────────────────────
function showLeaderboard(lb) {
  const podium = document.getElementById('lbPodium');
  const list   = document.getElementById('lbList');

  const order  = [1, 0, 2];
  const pClass = ['lb-p-2','lb-p-1','lb-p-3'];
  const medals = ['🥈','🥇','🥉'];

  podium.innerHTML = order.map((rank, slot) => {
    const p = lb[rank];
    if (!p) return '<div class="lb-p"></div>';
    return `
      <div class="lb-p">
        <div class="lb-p-name">${p.name}</div>
        <div class="lb-p-score">${p.score} Pts</div>
        <div class="lb-p-block ${pClass[slot]}">${medals[slot]}</div>
      </div>`;
  }).join('');

  list.innerHTML = lb.map((p,i) => `
    <div class="lb-row">
      <div class="lb-row-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-row-name">${p.name}</div>
      <div class="lb-row-score">${p.score} Pts</div>
    </div>`).join('');

  show('leaderboard');
  startConfetti();
}

// ─── Confetti ─────────────────────────────────────────────
function startConfetti() {
  const canvas = document.getElementById('confettiP');
  const ctx    = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = Array.from({length:180}, () => ({
    x:  Math.random() * canvas.width,
    y:  Math.random() * -canvas.height,
    w:  8  + Math.random() * 10,
    h:  4  + Math.random() * 7,
    r:  Math.random() * Math.PI * 2,
    rv: (Math.random() - .5) * .12,
    vx: (Math.random() - .5) * 2.5,
    vy: 2.5 + Math.random() * 3.5,
    color:`hsl(${Math.random()*360},80%,60%)`
  }));
  let frame = 0;
  function draw() {
    if (frame++ > 450) { canvas.style.display='none'; return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.rv;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random()*canvas.width; }
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ─── Screen helper ────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
}

// ─── Admin next button ────────────────────────────────────
function doNext() {
  socket.emit('nextQuestion', { code: CODE, adminPassword: PW });
}
</script>
</body>
</html>
