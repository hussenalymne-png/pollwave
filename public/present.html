<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PollWave – Präsentation</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Particles ── */
    #particles {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0.15;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    /* ── Screens ── */
    .screen {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      padding: 40px;
    }
    .screen.active { display: flex; }

    /* ── Header Bar ── */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(15,15,26,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid rgba(255,102,0,0.4);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 16px;
      z-index: 10;
    }
    .top-bar img { height: 36px; }
    .top-bar .quiz-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-bar .room-pill {
      margin-left: auto;
      background: rgba(255,102,0,0.15);
      border: 1px solid rgba(255,102,0,0.5);
      color: #FF6600;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2px;
    }

    /* ── Waiting Screen ── */
    #waitScreen {
      background: radial-gradient(ellipse at 30% 40%, rgba(255,102,0,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 60%, rgba(78,205,196,0.1) 0%, transparent 60%),
                  #0f0f1a;
      padding-top: 64px;
    }
    .wait-logo {
      width: 120px;
      height: 120px;
      background: rgba(255,102,0,0.1);
      border: 2px solid rgba(255,102,0,0.4);
      border-radius: 30px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .wait-logo img { width: 80px; }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 20px rgba(255,102,0,0.3); }
      50%      { box-shadow: 0 0 40px rgba(255,102,0,0.6); }
    }

    .wait-title {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 900;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
    }
    .wait-subtitle {
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 48px;
    }

    .join-info {
      display: flex;
      gap: 48px;
      align-items: center;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 32px 48px;
    }
    .qr-wrap img { border-radius: 16px; width: 160px; }
    .join-details { text-align: left; }
    .join-url { font-size: 18px; color: #4ECDC4; font-weight: 700; margin-bottom: 12px; }
    .join-code { font-size: 56px; font-weight: 900; color: #FF6600; letter-spacing: 6px; line-height: 1; }
    .join-code-label { font-size: 14px; color: #aaa; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .player-count {
      margin-top: 16px;
      background: rgba(78,205,196,0.15);
      border: 1px solid rgba(78,205,196,0.4);
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 16px;
      color: #4ECDC4;
      font-weight: 700;
    }

    /* ── Question Screen ── */
    #questionScreen {
      padding-top: 80px;
      justify-content: flex-start;
      background: #0f0f1a;
    }
    .question-wrap {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .question-header-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .q-counter {
      background: rgba(255,102,0,0.2);
      border: 1px solid rgba(255,102,0,0.5);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      color: #FF6600;
      white-space: nowrap;
    }
    .q-text {
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 800;
      flex: 1;
      line-height: 1.3;
    }

    /* Timer */
    .timer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timer-circle {
      position: relative;
      width: 100px; height: 100px;
      flex-shrink: 0;
    }
    .timer-circle svg { transform: rotate(-90deg); }
    .timer-circle .timer-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
    .timer-circle .timer-progress {
      fill: none;
      stroke: #FF6600;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 251;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }
    .timer-number {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #FF6600;
    }

    /* Answer Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .option-card {
      border-radius: 16px;
      padding: 20px 24px;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .option-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      background: rgba(0,0,0,0.2);
      flex-shrink: 0;
    }
    .option-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      opacity: 0.3;
      transition: width 0.5s ease;
      width: 0%;
    }
    .option-text { position: relative; z-index: 1; flex: 1; }
    .option-count {
      position: relative; z-index: 1;
      font-size: 14px;
      opacity: 0.8;
      font-weight: 800;
    }

    .opt-0 { background: rgba(231,76,60,0.25);  border: 2px solid rgba(231,76,60,0.6); }
    .opt-1 { background: rgba(52,152,219,0.25); border: 2px solid rgba(52,152,219,0.6); }
    .opt-2 { background: rgba(241,196,15,0.25); border: 2px solid rgba(241,196,15,0.6); }
    .opt-3 { background: rgba(46,204,113,0.25); border: 2px solid rgba(46,204,113,0.6); }

    .opt-0 .option-bar { background: #e74c3c; }
    .opt-1 .option-bar { background: #3498db; }
    .opt-2 .option-bar { background: #f1c40f; }
    .opt-3 .option-bar { background: #2ecc71; }

    .option-card.correct { border-color: #4ECDC4 !important; box-shadow: 0 0 20px rgba(78,205,196,0.4); }
    .option-card.wrong   { opacity: 0.4; }

    /* Answer stat bar */
    .answer-progress {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #aaa;
    }
    .answer-progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .answer-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF6600, #4ECDC4);
      border-radius: 3px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Question Image */
    .question-image {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── Presenter Next Button ── */
    .presenter-btn-wrap {
      display: none;
      justify-content: center;
      margin-top: 8px;
    }
    .presenter-btn-wrap.visible { display: flex; }
    .btn-next-presenter {
      padding: 16px 48px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 30px rgba(255,102,0,0.5);
      transition: all 0.2s;
      animation: btnPulse 1.5s ease-in-out infinite;
    }
    .btn-next-presenter:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 40px rgba(255,102,0,0.7);
    }
    @keyframes btnPulse {
      0%,100% { box-shadow: 0 6px 30px rgba(255,102,0,0.5); }
      50%      { box-shadow: 0 6px 50px rgba(255,102,0,0.8); }
    }

    /* ── Podium Screen ── */
    #podiumScreen {
      background: radial-gradient(ellipse at center, rgba(255,102,0,0.2) 0%, transparent 70%), #0f0f1a;
      padding-top: 64px;
    }
    .podium-title {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 900;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 48px;
      text-align: center;
    }
    .podium-wrap {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      margin-bottom: 48px;
    }
    .podium-place {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .podium-avatar {
      width: 70px; height: 70px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      font-weight: 900;
      border: 3px solid transparent;
    }
    .podium-name  { font-weight: 800; font-size: 16px; text-align: center; max-width: 120px; }
    .podium-score { font-size: 14px; color: #aaa; }
    .podium-block {
      border-radius: 12px 12px 0 0;
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    .place-1 .podium-avatar { background: rgba(255,215,0,0.2); border-color: #FFD700; }
    .place-1 .podium-block  { background: linear-gradient(180deg, #FFD700, #FFA500); height: 140px; }
    .place-2 .podium-avatar { background: rgba(192,192,192,0.2); border-color: #C0C0C0; }
    .place-2 .podium-block  { background: linear-gradient(180deg, #C0C0C0, #A0A0A0); height: 100px; }
    .place-3 .podium-avatar { background: rgba(205,127,50,0.2); border-color: #CD7F32; }
    .place-3 .podium-block  { background: linear-gradient(180deg, #CD7F32, #A0522D); height: 70px; }

    .podium-list {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .podium-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 10px 16px;
    }
    .podium-row .rank { width: 28px; text-align: center; font-weight: 800; color: #aaa; }
    .podium-row .p-name { flex: 1; font-weight: 600; }
    .podium-row .p-score { color: #FF6600; font-weight: 800; }

    /* ── Confetti ── */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 100; }

    /* ── Join overlay for presenter ── */
    #joinOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      backdrop-filter: blur(10px);
    }
    .join-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,102,0,0.4);
      border-radius: 24px;
      padding: 40px;
      width: 380px;
      text-align: center;
    }
    .join-box h2 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #FF6600, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .join-box p { color: #aaa; margin-bottom: 24px; }
    .join-box input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 4px;
      font-weight: 800;
    }
    .join-box input:focus { outline: none; border-color: #FF6600; }
    .join-box button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF6600, #e55a00);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Particles -->
<div id="particles"></div>

<!-- Confetti -->
<canvas id="confetti"></canvas>

<!-- Join Overlay -->
<div id="joinOverlay">
  <div class="join-box">
    <h2>🐢 PollWave</h2>
    <p>Raum-Code eingeben um zu starten</p>
    <input type="text" id="codeInput" placeholder="ABC123" maxlength="6" />
    <button onclick="joinPresenter()">📺 Präsentation starten</button>
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar" id="topBar" style="display:none">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Galaxus_logo.svg/1200px-Galaxus_logo.svg.png" alt="Galaxus" />
  <span class="quiz-title" id="topQuizTitle">PollWave Quiz</span>
  <span class="room-pill" id="topRoomCode">------</span>
</div>

<!-- WAITING -->
<div class="screen" id="waitScreen">
  <div class="wait-logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Galaxus_logo.svg/1200px-Galaxus_logo.svg.png" alt="Galaxus" />
  </div>
  <div class="wait-title" id="waitTitle">PollWave Quiz</div>
  <div class="wait-subtitle">Bereit für das Quiz? 🚀</div>
  <div class="join-info">
    <div class="qr-wrap" id="waitQR"></div>
    <div class="join-details">
      <div class="join-url" id="waitUrl"></div>
      <div class="join-code" id="waitCode">------</div>
      <div class="join-code-label">Raum-Code</div>
      <div class="player-count" id="waitPlayers">👥 0 Spieler bereit</div>
    </div>
  </div>
</div>

<!-- QUESTION -->
<div class="screen" id="questionScreen">
  <div class="question-wrap">
    <div class="question-header-row">
      <div class="q-counter" id="qCounter">Frage 1/1</div>
      <div class="q-text" id="qText">Frage lädt…</div>
      <div class="timer-wrap">
        <div class="timer-circle">
          <svg width="100" height="100" viewBox="0 0 100 100">
            <circle class="timer-bg" cx="50" cy="50" r="40"/>
            <circle class="timer-progress" id="timerProgress" cx="50" cy="50" r="40"/>
          </svg>
          <div class="timer-number" id="timerNumber">30</div>
        </div>
      </div>
    </div>

    <img id="questionImage" class="question-image" style="display:none" />

    <div class="options-grid" id="optionsGrid"></div>

    <div class="answer-progress">
      <span id="answerProgressText">0/0 geantwortet</span>
      <div class="answer-progress-bar">
        <div class="answer-progress-fill" id="answerProgressFill"></div>
      </div>
    </div>

    <div class="presenter-btn-wrap" id="presenterBtnWrap">
      <button class="btn-next-presenter" onclick="presenterNext()">⏭ Nächste Frage</button>
    </div>
  </div>
</div>

<!-- PODIUM -->
<div class="screen" id="podiumScreen">
  <div class="podium-title">🏆 Das sind die Gewinner!</div>
  <div class="podium-wrap" id="podiumWrap"></div>
  <div class="podium-list" id="podiumList"></div>
</div>

<script>
  const socket = io();
  let roomCode   = '';
  let isPresenter = true;
  let maxTime = 30;
  let totalPlayers = 0;
  let currentOptions = [];

  const OPTION_ICONS  = ['🔴','🔵','🟡','🟢'];

  // ── Particles ──
  (function spawnParticles() {
    const container = document.getElementById('particles');
    const colors = ['#FF6600','#4ECDC4','#FF8C00','#00BFA5'];
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 8 + 4;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        animation-duration:${Math.random()*15+10}s;
        animation-delay:-${Math.random()*20}s;
      `;
      container.appendChild(p);
    }
  })();

  // ── Join ──
  function joinPresenter() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length !== 6) return alert('Bitte 6-stelligen Code eingeben');
    roomCode = code;
    socket.emit('joinRoom', { code, name: '__presenter__' });
  }

  socket.on('joinedAsPresenter', ({ quizName, state, playerCount }) => {
    document.getElementById('joinOverlay').style.display = 'none';
    document.getElementById('topBar').style.display = 'flex';
    document.getElementById('topRoomCode').textContent = roomCode;
    document.getElementById('topQuizTitle').textContent = quizName || 'PollWave Quiz';

    const url = `${window.location.origin}?code=${roomCode}`;
    document.getElementById('waitTitle').textContent  = quizName || 'PollWave Quiz';
    document.getElementById('waitCode').textContent   = roomCode;
    document.getElementById('waitUrl').textContent    = window.location.origin;
    document.getElementById('waitPlayers').textContent = `👥 ${playerCount} Spieler bereit`;
    document.getElementById('waitQR').innerHTML =
      `<img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}" />`;

    showScreen('waitScreen');
    totalPlayers = playerCount;
  });

  socket.on('error', ({ message }) => alert(message));

  // ── Screens ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── Player count ──
  socket.on('playerJoined', ({ playerCount }) => {
    totalPlayers = playerCount;
    document.getElementById('waitPlayers').textContent = `👥 ${playerCount} Spieler bereit`;
  });
  socket.on('playerLeft', ({ playerCount }) => {
    totalPlayers = playerCount;
  });

  // ── Quiz Name Update ──
  socket.on('quizNameUpdated', ({ quizName }) => {
    document.getElementById('topQuizTitle').textContent = quizName;
    document.getElementById('waitTitle').textContent    = quizName;
  });

  // ── Game Started ──
  socket.on('gameStarted', ({ quizName }) => {
    document.getElementById('topQuizTitle').textContent = quizName || 'PollWave Quiz';
    document.getElementById('waitTitle').textContent    = quizName || 'PollWave Quiz';
    hidePresentBtn();
  });

  // ── New Question ──
  socket.on('newQuestion', ({ index, total, question, options, image, time }) => {
    maxTime = time;
    currentOptions = options;
    showScreen('questionScreen');
    hidePresentBtn();

    document.getElementById('qCounter').textContent = `Frage ${index+1} / ${total}`;
    document.getElementById('qText').textContent    = question;

    const img = document.getElementById('questionImage');
    if (image) { img.src = image; img.style.display = 'block'; }
    else        { img.style.display = 'none'; }

    // Timer reset
    setTimer(time, time);

    // Options
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = options.map((opt, i) => `
      <div class="option-card opt-${i}" id="opt_${i}">
        <div class="option-bar" id="bar_${i}"></div>
        <div class="option-icon">${OPTION_ICONS[i]}</div>
        <div class="option-text">${opt}</div>
        <div class="option-count" id="cnt_${i}">0</div>
      </div>`).join('');

    // Progress reset
    document.getElementById('answerProgressText').textContent = `0/${totalPlayers} geantwortet`;
    document.getElementById('answerProgressFill').style.width = '0%';
  });

  // ── Timer ──
  socket.on('timerUpdate', ({ timeLeft, maxTime: mt }) => {
    setTimer(timeLeft, mt);
  });

  function setTimer(timeLeft, max) {
    const circumference = 251;
    const offset = circumference * (1 - timeLeft / max);
    const progress = document.getElementById('timerProgress');
    progress.style.strokeDashoffset = offset;
    progress.style.stroke = timeLeft <= 5 ? '#e74c3c' : timeLeft <= 10 ? '#f1c40f' : '#FF6600';
    document.getElementById('timerNumber').textContent = timeLeft;
    document.getElementById('timerNumber').style.color = timeLeft <= 5 ? '#e74c3c' : timeLeft <= 10 ? '#f1c40f' : '#FF6600';
  }

  // ── Answer Update ──
  socket.on('answerUpdate', ({ answerCounts, totalAnswers, totalPlayers: tp }) => {
    if (tp) totalPlayers = tp;
    const total = answerCounts.reduce((a,b) => a+b, 0);
    answerCounts.forEach((count, i) => {
      const pct = total > 0 ? (count / total * 100) : 0;
      const bar = document.getElementById(`bar_${i}`);
      const cnt = document.getElementById(`cnt_${i}`);
      if (bar) bar.style.width = pct + '%';
      if (cnt) cnt.textContent = count;
    });
    const pct = totalPlayers > 0 ? (totalAnswers / totalPlayers * 100) : 0;
    document.getElementById('answerProgressText').textContent = `${totalAnswers}/${totalPlayers} geantwortet`;
    document.getElementById('answerProgressFill').style.width = pct + '%';
  });

  // ── Question End ──
  socket.on('questionEnd', ({ correctAnswer }) => {
    for (let i = 0; i < currentOptions.length; i++) {
      const card = document.getElementById(`opt_${i}`);
      if (card) card.classList.add(i === correctAnswer ? 'correct' : 'wrong');
    }
    showPresentBtn();
  });

  // ── Presenter Next ──
  function presenterNext() {
    socket.emit('nextQuestion', { code: roomCode });
    hidePresentBtn();
  }

  function showPresentBtn() {
    document.getElementById('presenterBtnWrap').classList.add('visible');
  }
  function hidePresentBtn() {
    document.getElementById('presenterBtnWrap').classList.remove('visible');
  }

  // ── Game Finished ──
  socket.on('gameFinished', ({ players }) => {
    showScreen('podiumScreen');
    hidePresentBtn();
    buildPodium(players);
    startConfetti();
  });

  // ── Podium ──
  function buildPodium(players) {
    const wrap = document.getElementById('podiumWrap');
    const list = document.getElementById('podiumList');
    const medals = ['🥇','🥈','🥉'];
    const initials = name => name.slice(0,2).toUpperCase();

    const top3 = [players[1], players[0], players[2]].filter(Boolean);
    const placeClass = (p) => {
      const rank = players.indexOf(p);
      return `place-${rank+1}`;
    };

    wrap.innerHTML = [players[1], players[0], players[2]].map((p, idx) => {
      if (!p) return '';
      const rank = players.indexOf(p) + 1;
      return `
        <div class="podium-place place-${rank}">
          <div class="podium-avatar">${initials(p.name)}</div>
          <div class="podium-name">${p.name}</div>
          <div class="podium-score">${p.score} Pts</div>
          <div class="podium-block">${medals[rank-1]||''}</div>
        </div>`;
    }).join('');

    list.innerHTML = players.slice(3).map((p, i) => `
      <div class="podium-row">
        <div class="rank">${i+4}</div>
        <div class="p-name">${p.name}</div>
        <div class="p-score">${p.score} Pts</div>
      </div>`).join('');
  }

  // ── Game Reset ──
  socket.on('gameReset', () => {
    hidePresentBtn();
    showScreen('waitScreen');
  });

  // ── Confetti ──
  function startConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx    = canvas.getContext('2d');
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;

    const pieces = Array.from({ length: 150 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 12 + 6,
      h: Math.random() * 6 + 4,
      color: ['#FF6600','#4ECDC4','#FFD700','#FF8C00','#00BFA5'][Math.floor(Math.random()*5)],
      speed: Math.random() * 4 + 2,
      angle: Math.random() * 360,
      spin:  (Math.random() - 0.5) * 4
    }));

    let frame;
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle * Math.PI / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
        p.y     += p.speed;
        p.angle += p.spin;
        if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      });
      frame = requestAnimationFrame(draw);
    }
    draw();
    setTimeout(() => { cancelAnimationFrame(frame); ctx.clearRect(0,0,canvas.width,canvas.height); }, 6000);
  }
</script>
</body>
